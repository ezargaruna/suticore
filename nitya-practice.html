[data-nitya-practice] {
  --practice-ink: var(--suti-angel-ink, #25342f);
  --practice-surface: var(--suti-angel-card, #fbf8f1);
  --practice-paper: var(--suti-angel-paper, #f4f0e8);
  --practice-action: var(--suti-angel-teal, #135b60);
  --practice-line: var(--suti-angel-line, #cbd8d5);
  --practice-focus: var(--suti-angel-focus, #135b60);
  position: relative;
  box-sizing: border-box;
  inline-size: min(100%, 52rem);
  min-inline-size: 0;
  margin-inline: auto;
  padding: clamp(1.1rem, 5vw, 3rem);
  border: 1px solid var(--practice-line);
  border-radius: 1.25rem;
  background: var(--practice-surface);
  color: var(--practice-ink);
  font-family: "SUTI Manrope", Manrope, system-ui, sans-serif;
  line-height: 1.65;
  text-align: start;
  overflow-wrap: anywhere;
}

[data-nitya-practice]:empty {
  display: none;
}

[data-nitya-practice] :is(h2, h3) {
  margin: 0;
  line-height: 1.2;
}

[data-nitya-practice] h2 {
  font-size: clamp(1.8rem, 4.5vw, 3rem);
}

[data-nitya-practice] .nitya-practice__heading {
  margin-block: 1.5rem 1rem;
}

[data-nitya-practice] p {
  max-inline-size: 66ch;
  margin-block: .75rem;
}

[data-nitya-practice] .nitya-practice__kicker {
  margin-block: 0 .35rem;
  color: var(--practice-action);
  font-size: .9em;
  font-weight: 650;
}

[data-nitya-practice] .nitya-practice__language {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  justify-items: start;
  gap: .25rem;
  margin-inline-start: auto;
  inline-size: fit-content;
  max-inline-size: 100%;
}

[data-nitya-practice] label {
  color: var(--practice-ink);
  font-size: .875em;
}

[data-nitya-practice] :is(select, button) {
  box-sizing: border-box;
  min-block-size: 44px;
  max-inline-size: 100%;
  border: 1px solid currentColor;
  border-radius: .55rem;
  background: var(--practice-surface);
  color: var(--practice-ink);
  font: inherit;
}

[data-nitya-practice] select {
  padding: .3rem;
}

[data-nitya-practice] button {
  padding: .45rem .85rem;
  line-height: 1.4;
  cursor: pointer;
}

[data-nitya-practice] .nitya-practice__primary {
  border: 2px solid var(--practice-action);
  background: var(--practice-paper);
  color: var(--practice-action);
  font-weight: 750;
}

[data-nitya-practice] button[aria-pressed="true"] {
  box-shadow: inset 0 0 0 1px currentColor;
  background: var(--practice-paper);
  color: var(--practice-action);
  font-weight: 750;
}

[data-nitya-practice] :is(button, select, summary, a, [tabindex]):focus-visible {
  outline: 3px solid var(--practice-focus);
  outline-offset: 3px;
}

[data-nitya-practice] :is(.nitya-practice__choices, .nitya-practice__actions, .nitya-practice__links) {
  display: flex;
  flex-wrap: wrap;
  gap: .6rem;
  margin-block: 1rem;
}

[data-nitya-practice] details {
  margin-block: .8rem;
  padding-inline: .85rem;
  border: 1px solid var(--practice-line);
  border-radius: .55rem;
  background: var(--practice-paper);
}

[data-nitya-practice] summary {
  min-block-size: 44px;
  padding-block: .5rem;
  box-sizing: border-box;
  color: var(--practice-ink);
  cursor: pointer;
}

[data-nitya-practice] :is(ol, ul) {
  padding-inline-start: 1.35rem;
}

[data-nitya-practice] .nitya-practice__turn {
  margin-block: 1.3rem;
}

[data-nitya-practice] .nitya-practice__prompt {
  padding: .85rem;
  border-inline-start: 3px solid var(--practice-action);
  background: var(--practice-paper);
}

[data-nitya-practice] a {
  color: var(--practice-action);
  text-decoration: underline;
  text-underline-offset: .18em;
}

[data-nitya-practice] :is(.nitya-practice__review, .nitya-practice__privacy, .nitya-practice__dates) {
  font-size: .9em;
}

[data-nitya-practice]:is(:lang(ar), :lang(bn), :lang(hi), :lang(sa), :lang(zh)) :is(h2, h3) {
  font-family: inherit;
  letter-spacing: normal;
  line-height: 1.4;
}

@media (forced-colors: active) {
  [data-nitya-practice] button[aria-pressed="true"] {
    outline: 1px solid ButtonText;
    outline-offset: -3px;
  }
}

[data-nitya-practice] .nitya-practice__announcer {
  position: absolute;
  inset-block-start: 0;
  inset-inline-start: 0;
  inline-size: 1px;
  block-size: 1px;
  padding: 0;
  margin: -1px;
  clip-path: inset(50%);
  overflow: hidden;
  white-space: nowrap;
}
[data-nitya-route] {
  color: var(--suti-angel-ink, #25342f);
  margin-block-start: 1rem;
  overflow-wrap: anywhere;
}

[data-nitya-route] details {
  border: 1px solid currentColor;
  border-radius: 12px;
  padding: 0 clamp(.75rem, 3vw, 1.4rem);
}

[data-nitya-route] summary {
  cursor: pointer;
  font-weight: 700;
  padding-block: .75rem;
}

[data-nitya-route] .nitya-route__panel {
  padding-block: 0 1rem;
}

[data-nitya-route] .nitya-route__notice {
  font-size: .9em;
  margin-block: 0 .5rem;
}

[data-nitya-route] fieldset {
  border: 0;
  margin: 0;
  min-inline-size: 0;
  padding: 0;
}

[data-nitya-route] legend {
  margin-block-end: .4rem;
  padding: 0;
}

[data-nitya-route] .nitya-route__choice {
  align-items: baseline;
  cursor: pointer;
  display: flex;
  gap: .6rem;
  min-block-size: 44px;
  padding: .45rem .25rem;
}

[data-nitya-route] input[type="radio"] {
  accent-color: var(--suti-petrol, #365958);
  inline-size: 1.1rem;
  flex: 0 0 auto;
  margin: 0;
}

[data-nitya-route] .nitya-route__actions {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  margin-block-start: .65rem;
}

[data-nitya-route] button {
  background: transparent;
  border: 1px solid currentColor;
  border-radius: 8px;
  color: inherit;
  cursor: pointer;
  font: inherit;
  min-block-size: 44px;
  padding: .4rem .75rem;
}

[data-nitya-route] button:disabled {
  cursor: default;
  opacity: .68;
}

[data-nitya-route] :focus-visible,
[data-nitya-route] .nitya-route__choice:focus-within {
  outline: 2px solid currentColor;
  outline-offset: 2px;
}
[data-atlas-top],
[data-atlas-care],
[data-atlas-paths] {
  margin-block: 1.25rem;

}
[data-atlas-top] {
  background: var(--suti-angel-card);
  border-block-start: .25rem solid var(--suti-angel-teal);
  border-radius: .7rem;
  padding: clamp(1rem, 4vw, 2.5rem);
}
[data-atlas-top] h1 {
  margin-block: .25rem;
  font-size: clamp(2rem, 6vw, 3.8rem);
}
.atlas-kicker {
  color: var(--suti-angel-teal);
  margin-block-end: 0;
  font-weight: 700;
}
.atlas-lead {
  max-inline-size: 35ch;
  font-size: clamp(1.15rem, 3vw, 1.5rem);
}
.atlas-links,
.atlas-modules,
.atlas-care__controls,
.atlas-care__options {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  align-items: center;
}
.atlas-modules { padding-inline-start: 0; list-style: none; }
.atlas-links a,
.atlas-modules a,
[data-atlas-care] button,
[data-atlas-care] select,
[data-atlas-top] input {
  display: inline-flex;
  min-block-size: 44px;
  align-items: center;
  max-inline-size: 100%;
  padding: .35rem .65rem;
  color: var(--suti-angel-ink);
  border: 1px solid currentColor;
  border-radius: .4rem;
  background: var(--suti-angel-card);
}
.atlas-links a:first-child,
[data-atlas-care] button[aria-pressed="true"] {
  background: var(--suti-angel-teal);

}
[data-atlas-panel],
[data-atlas-care] {
  border: 1px solid var(--suti-angel-line);
  border-radius: .6rem;

}
[data-atlas-panel] summary {
  cursor: pointer;

}
[data-atlas-panel] label { display: block; }
.atlas-cards {

.atlas-cards li {

  border: 1px solid var(--suti-angel-line);
  border-radius: .6rem;
}
.atlas-cards h3, .atlas-cards p { margin-block: .25rem; }
.atlas-care__answer {
  min-block-size: 6rem;

  padding: .65rem;
}
[data-atlas-care] select { display: inline-block; }
[data-atlas-care] button { cursor: pointer; }
:where([data-atlas-top], [data-atlas-care], [data-atlas-paths]) :focus-visible {
  outline: 3px solid var(--suti-angel-focus);
  outline-offset: 3px;
}
[data-atlas-top] button {
  min-block-size: 44px;

}
.atlas-cards summary {
  min-block-size: 44px;
  cursor: pointer;
  font-weight: 700;
}

  <script>
(() => {
  'use strict';
  const top = document.querySelector('[data-atlas-top]');
  const paths = document.querySelector('[data-atlas-paths]');
  const editions = JSON.parse(document.getElementById('nitya-atlas-copy').textContent);
  const pages = 'https://ezargaruna.github.io/suticore/';
  const github = 'https://github.com/ezargaruna/';
  const modules = [
    ['.vault', github + 'SUTI.os/releases/latest'],
    ['.os', 'system/{locale}/SUTI.os/living-system.html'],
    ['.lab', 'system/{locale}/SUTI.lab/living-system.html'],
    ['.uni', 'system/{locale}/SUTI.uni/living-system.html'],
    ['.game', 'system/{locale}/SUTI.game/living-system.html'],
    ['.nitya', '#nitya-90-day-practice'],
    ['.sreteniya', 'app/docs/sreteniya-manifest.md'],
    ['.12dar', 'meta/modules/12_gifts.md'],
    ['.7lum', 'meta/modules/divas_7_lights.md'],
    ['.kolozar', 'meta/modules/kolozar.md'],
    ['.luna', 'meta/lunar.md'],
    ['.astro', 'meta/stellar.md'],
    ['.alcharion', null],
    ['.ignem', null],
    ['.synaura', 'modules/synaura/guide/{locale}.html'],
    ['.syntaxium', 'modules/suti/syntaxium-2026.11.en.html'],
  ];
  const source = github + 'suticore/blob/main/';
  let dateValue = '';

  function el(tag, text, attrs = {}) {
    const node = document.createElement(tag);
    if (text) node.textContent = text;
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    return node;
  }

  function link(label, href, attrs = {}) {
    const a = el('a', label, { href, ...attrs });
    if (window.parent !== window && href.startsWith('https://')) {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    }
    return a;
  }

  function disclosure(label, kind, ...content) {
    const details = el('details', '', { 'data-atlas-panel': kind });
    details.append(el('summary', label), ...content);
    return details;
  }

  function cards(records) {
    const list = el('ul', '', { class: 'atlas-cards' });
    for (const [label, prompt] of records) {
      const item = el('li');
      item.append(el('h3', label), el('p', prompt));
      list.append(item);
    }
    return list;
  }

  function render({ language = 'ru', contentLanguage = 'ru', direction = 'ltr' } = {}) {
    const edition = editions[contentLanguage] || editions.ru;
    const locale = ({ 'es-419': 'es', 'zh-Hans': 'zh-hans' })[contentLanguage] || contentLanguage.toLowerCase();
    const guideLocale = language === 'yzh' ? 'yzh' : locale;
    const systemLocale = locale === 'ru' ? '_techne/human/collective-living-system-v1/ru' : locale;
    const open = new Set([...document.querySelectorAll('[data-atlas-panel][open]')].map(x => x.dataset.atlasPanel));
    top.lang = paths.lang = contentLanguage;
    top.dir = paths.dir = direction;
    top.dataset.language = language;
    document.title = 'NITYA · ' + edition.title;
    document.querySelector('meta[name="description"]').content = edition.intro;

    const counter = el('p', '', { id: 'atlas-countdown-status', role: 'status' });
    const date = el('input', '', { type: 'date', id: 'atlas-countdown-date', 'aria-describedby': counter.id });
    date.value = dateValue;
    const count = () => {
      if (!dateValue) {
        counter.textContent = '';
        return;
      }
      const now = new Date();
      const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
      const days = Math.round((Date.parse(dateValue) - today) / 86400000);
      counter.textContent = days > 0
        ? edition.countdown + ' · ' + new Intl.NumberFormat(contentLanguage).format(days) + ' ' + edition.days
        : edition.started;
    };
    date.addEventListener('change', () => { dateValue = date.value; count(); });
    count();
    const clearCountdown = el('button', edition.clearCountdown, { type: 'button' });
    clearCountdown.addEventListener('click', () => { dateValue = ''; date.value = ''; count(); date.focus(); });
    const setup = disclosure(edition.personalCount, 'countdown',
      el('label', edition.dateLabel, { for: date.id }), date, clearCountdown, counter);
    const season = disclosure(edition.seasonTitle, 'season', el('p', edition.seasonText));
    const links = el('nav', '', { class: 'atlas-links', 'aria-label': edition.title });
    for (const [name, href, attrs] of [
      ['practice', '#nitya-90-day-practice'], ['care', '#care-questionnaire'],
      ['verenium', pages + 'downloads/Verenium.zip'],
      ['veche', pages + 'system/' + systemLocale + '/SUTI.veche/living-system.html'],
      ['archive', github + 'SUTI.os/releases/latest'],
      ['prices', source + 'docs/commercial-catalog.v1.md', { hreflang: 'en' }],
    ]) links.append(link(edition.nav[name], href, attrs));
    top.replaceChildren(el('p', edition.finist, { class: 'atlas-kicker' }),
      el('h1', edition.title), el('p', edition.intro, { class: 'atlas-lead' }), links,
      el('p', edition.unknownStart), setup, season,
      el('p', language === 'yzh' ? 'язэхъ · показана русская редакция' : edition.review, { class: 'atlas-review' }));
    const quest = el('section', '', { 'aria-labelledby': 'atlas-quest' });
    quest.append(el('h2', edition.questTitle, { id: 'atlas-quest' }), el('p', edition.questIntro));
    const steps = el('ol', '', { class: 'atlas-cards' });
    const follow = el('p');
    for (const [label, prompt] of edition.questSteps) {
      const item = el('li');
      const turn = el('details');
      turn.append(el('summary', label), el('p', prompt));
      item.append(turn);
      steps.append(item);
    }
    follow.append(document.createTextNode(edition.questEnd + ' · '), link(edition.questContinue, '#nitya-90-day-practice'));
    quest.append(steps, follow);
    const audience = disclosure(edition.audienceTitle, 'audience', cards(Object.values(edition.audiences)));
    const geography = disclosure(edition.geographyTitle, 'geography', el('p', edition.geographyNote),
      cards(Object.values(edition.regions)), el('p', edition.tartaryNote));
    const shelf = el('ul', '', { class: 'atlas-modules' });
    for (const [name, ref] of modules) {
      const item = el('li');
      if (!ref) {
        item.append(el('span', name + ' · HOLD', { lang: 'en' }));
      } else {
        const href = ref.startsWith('https:') || ref.startsWith('#') ? ref
          : (ref.endsWith('.md') ? source : pages) + ref.replace('{locale}', ref.includes('/guide/') ? guideLocale : systemLocale);
        const attrs = ref.endsWith('.md') ? { hreflang: ['.luna', '.astro'].includes(name) ? 'en' : 'ru' } : {};
        item.append(link(name, href, attrs));
      }
      shelf.append(item);
    }
    const editionSource = link(edition.sources, source + 'docs/language-layers.md', { hreflang: 'en' });
    paths.replaceChildren(quest, el('p', edition.openNote), audience, geography, disclosure(edition.moduleTitle, 'modules', shelf, editionSource));
    for (const panel of document.querySelectorAll('[data-atlas-panel]')) panel.open = open.has(panel.dataset.atlasPanel);
  }

  window.addEventListener('nitya:language', event => render(event.detail));
})();
  </script>

  const copies = { ...coreCopy, ...additionalCopy, 'es-419': coreCopy.es };

  function normalizeLanguage(value) {
    const aliases = { es: 'es-419', pt: 'pt-BR', zh: 'zh-Hans', 'zh-CN': 'zh-Hans' };
    const code = Object.hasOwn(aliases, value) ? aliases[value] : value;
    return Object.hasOwn(editions, code) ? code : null;
  }

  let language = normalizeLanguage(new URLSearchParams(location.search).get('lang'))
    ?? normalizeLanguage(document.documentElement.dataset.practiceLanguage)
    ?? normalizeLanguage(document.documentElement.lang) ?? 'ru';
  let context = null;
  let topic = null;
  let phase = 'ready';
  let startedAt = null;

  const view = node('div');
  const announcement = node('p', '', { class: 'nitya-practice__announcer', role: 'status', 'aria-atomic': 'true' });
  mount.replaceChildren(view, announcement);

  function node(tag, content, attributes = {}) {
    const element = document.createElement(tag);
    if (content) element.textContent = content;
    for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
    return element;
  }

  function button(text, key, handler, primary = false) {
    const control = node('button', text, { type: 'button', 'data-focus': key });
    if (primary) control.classList.add('nitya-practice__primary');
    control.addEventListener('click', handler);
    return control;
  }

  function choice(text, key, isSelected, handler) {
    const control = button(text, key, handler);
    control.setAttribute('aria-pressed', String(isSelected));
    return control;
  }

  function details(title, kind) {
    const panel = node('details', '', { 'data-panel': kind });
    const label = node('summary', title, { 'data-focus': kind });
    panel.append(label);
    return panel;
  }

  function group(title, ...children) {
    const container = node('div', '', { class: 'nitya-practice__choices', role: 'group', 'aria-label': title });
    container.append(...children);
    return container;
  }

  function campaignInterval(label, start, end, format) {
    const row = node('li', `${label} · `);
    const interval = node('bdi', '', { class: 'nitya-practice__interval' });
    interval.append(
      node('time', format(start), { datetime: start }),
      document.createTextNode(' – '),
      node('time', format(end), { datetime: end }),
    );
    row.append(interval);
    return row;
  }

  function dateRangeFormat(code, options) {
    const formatter = new Intl.DateTimeFormat(code, { calendar: 'gregory', ...options });
    if (Intl.DateTimeFormat.supportedLocalesOf([code]).length) {
      return value => formatter.format(value);
    }
    // Keep an unambiguous numeric date where the browser lacks a date dictionary.
    const isoFormat = new Intl.DateTimeFormat('en-CA', {
      ...options, year: 'numeric', month: '2-digit', day: '2-digit',
    });
    return value => {
      const parts = Object.fromEntries(isoFormat.formatToParts(value).map(part => [part.type, part.value]));
      return `${parts.year}-${parts.month}-${parts.day}`;
    };
  }

  function setPhase(next, focus) {
    phase = next;
    render(focus);
  }

  function start() {
    startedAt ??= new Date();
    setPhase('active', 'turn');
  }

  function finish() {
    context = null;
    topic = null;
    startedAt = null;
    turn = 1;
    setPhase('closed', 'status');
  }

  function advance() {
    topic = null;
    if (turn >= turnCount) {
      setPhase('complete', 'status');
      return;
    }
    turn += 1;
    render('turn');
  }

  function renderTurn(t, dateLanguage, youngContext) {
    const area = node('div', '', { class: 'nitya-practice__turn' });
    const displayNumber = new Intl.NumberFormat(dateLanguage, { useGrouping: false }).format(turn);
    area.append(
      node('p', t.turnLabel.replace('{turn}', displayNumber), { class: 'nitya-practice__kicker' }),
      node('h3', t.topic, { tabindex: '-1', 'data-focus': 'turn' }),
      group(t.topic, ...topics.map(value => choice(t.topics[value], `topic-${value}`, topic === value, () => {
        topic = topic === value ? null : value;
        render(`topic-${value}`);
        if (topic) announcement.textContent = (youngContext ? t.childPrompts : t.prompts)[topic];
      }))),
    );
    if (topic) {
      area.append(
        node('p', (youngContext ? t.childPrompts : t.prompts)[topic], {
          class: 'nitya-practice__prompt',
        }),
        button(t.completeTurn, 'complete-turn', advance, true),
      );
    }
    area.append(node('p', t.result));
    return area;
  }

  function render(focusKey) {
    const oldFocus = mount.contains(document.activeElement) ? document.activeElement.dataset.focus : null;
    const openPanels = new Set([...mount.querySelectorAll('details[open]')].map(panel => panel.dataset.panel));
    const [, label, practiceDays, closingDays] = editions[language];
    announcement.textContent = '';
    const locale = language === 'yzh' ? 'ru' : language;
    const t = copies[locale];
    const method = workingCycle[language === 'es-419' ? 'es' : language];
    const dir = locale === 'ar' ? 'rtl' : 'ltr';
    const titleId = `${mount.id || 'nitya-practice'}-title`;
    const controlId = `${mount.id || 'nitya-practice'}-language`;
    mount.lang = locale;
    mount.dir = dir;
    mount.dataset.language = language;
    mount.setAttribute('aria-labelledby', titleId);

    const selector = node('select', '', { id: controlId, 'data-focus': 'language' });
    for (const [code, [autonym]] of Object.entries(editions)) {
      selector.add(node('option', autonym, {
        value: code, lang: code === 'yzh' ? 'ru' : code, dir: code === 'ar' ? 'rtl' : 'ltr',
      }));
    }
    selector.value = language;
    selector.dir = language === 'ar' ? 'rtl' : 'ltr';
    selector.addEventListener('change', () => setLanguage(selector.value));
    const localeField = node('div', '', { class: 'nitya-practice__language' });
    localeField.append(node('label', label, { for: controlId }), selector);

    const methodPanel = details(method.title, 'method');
    methodPanel.open = openPanels.has('method');
    const steps = node('ol');
    steps.append(...method.steps.map(step => node('li', step)));
    methodPanel.append(steps, node('p', method.note));

    const campaign = details(t.campaign, 'campaign');
    campaign.open = openPanels.has('campaign');
    const campaignList = node('ul');
    const utcFormat = dateRangeFormat(locale, { timeZone: 'UTC', day: 'numeric', month: 'long', year: 'numeric' });
    const dateLabel = iso => utcFormat(new Date(`${iso}T00:00:00Z`));
    campaignList.append(
      campaignInterval(practiceDays, campaignStart, campaignPracticeEnd, dateLabel),
      campaignInterval(closingDays, campaignClosingStart, campaignEnd, dateLabel),
    );
    campaign.append(campaignList, node('p', t.cadence));

    const review = language === 'yzh'
      ? 'язэхъ · авторский языковой эксперимент. здесь показан русский текст'
      : t.review;

    const heading = node('div', '', { class: 'nitya-practice__heading' });
    heading.append(node('p', t.kicker, { class: 'nitya-practice__kicker' }), node('h2', t.title, { id: titleId }));
    view.replaceChildren(localeField, heading, node('p', t.lead));

    if (phase === 'closed' || phase === 'complete') {
      view.append(
        node('p', phase === 'complete' ? t.completed : t.closed, { role: 'status', tabindex: '-1', 'data-focus': 'status' }),
        button(t.restart, 'restart', () => {
          context = null;
          startedAt = null;
          turn = 1;
          setPhase('ready', 'start');
        }, true),
      );
    } else {
      if (phase === 'ready') view.append(button(t.start, 'start', start, true));
      if (phase === 'paused' || phase === 'skipped') {
        view.append(
          node('p', t[phase], { role: 'status', tabindex: '-1', 'data-focus': 'status' }),
          button(t.resume, 'resume', start, true),
        );
      }
      if (startedAt) {
        const end = new Date(startedAt);
        end.setDate(end.getDate() + turnCount - 1);
        const personalFormat = dateRangeFormat(locale, { day: 'numeric', month: 'long', year: 'numeric' });
        const dates = node('p', `${t.window} · `, { class: 'nitya-practice__dates' });
        dates.append(node('bdi', `${personalFormat(startedAt)} – ${personalFormat(end)}`));
        view.append(dates);
      }

      const contextPanel = details(t.contexts, 'context');
      contextPanel.open = openPanels.has('context');
      contextPanel.append(node('p', t.contextHelp), group(t.contexts, ...contextOptions.map(value => {
        const contextLabel = value === 'caregiver' ? t.childLabel : value === 'education' ? t.teenLabel : value;
        return choice(contextLabel, value, context === value, () => {
          context = context === value ? null : value;
          render(value);
          if (context) announcement.textContent = context === 'caregiver' || context === 'education' ? t[context] : t.adult;
        });
      })));
      const youngContext = context === 'caregiver' || context === 'education';
      if (context) contextPanel.append(node('p', youngContext ? t[context] : t.adult));
      view.append(contextPanel);

      if (phase === 'active') {
        view.append(renderTurn(t, locale, youngContext));
        const actions = node('div', '', { class: 'nitya-practice__actions' });
        actions.append(
          button(t.pause, 'pause', () => setPhase('paused', 'status')),
          button(t.skip, 'skip', () => {
            topic = null;
            setPhase('skipped', 'status');
          }),
          button(t.exit, 'exit', finish),
        );
        view.append(actions);
      } else if (phase !== 'ready') {
        view.append(button(t.exit, 'exit', finish));
      }
    }

    const reviewNote = node('p', review, { class: 'nitya-practice__review', role: 'note' });
    view.append(reviewNote, methodPanel, campaign, node('p', t.privacy, { class: 'nitya-practice__privacy' }));
    const links = node('div', '', { class: 'nitya-practice__links' });
    for (const [kind, url, text] of [
      ['samurai', mount.dataset.samuraiUrl, t.samurai],
      ['angels', mount.dataset.angelsUrl, t.angels],
    ]) {
      if (!url) continue;
      const address = new URL(url, document.baseURI);
      if (!['https:', 'http:'].includes(address.protocol)) continue;
      if (kind === 'angels' && mount.hasAttribute('data-angels-locales')) {
        const suffix = { 'es-419': 'es', 'pt-BR': 'pt' }[language] ?? language;
        if (suffix !== 'ru') address.pathname = address.pathname.replace(/\.html$/, `-${suffix}.html`);
      } else if (kind !== 'samurai' && address.origin === location.origin) {
        address.searchParams.set('lang', language);
      }
      const attrs = { href: address.href };
      if (kind === 'samurai') attrs.hreflang = 'ru';
      if (window.parent !== window) {
        attrs.target = '_blank';
        attrs.rel = 'noopener';
      }
      const destination = node('a', text, attrs);
      if (kind === 'samurai' && locale !== 'ru') {
        destination.append(' · ', node('span', 'русский', { lang: 'ru', dir: 'ltr' }));
      }
      links.append(destination);
    }
    if (links.children.length) view.append(links);

    const focusTarget = focusKey ?? oldFocus;
    if (focusTarget) {
      const target = [...mount.querySelectorAll('[data-focus]')].find(element => element.dataset.focus === focusTarget);
      target?.focus({ preventScroll: focusTarget === oldFocus });
    }
  }

  function setLanguage(value) {
    const next = normalizeLanguage(value);
    if (!next || next === language) return;
    language = next;
    render();
    notifyLanguage();
  }

  function notifyLanguage() {
    window.dispatchEvent(new CustomEvent('nitya:language', {
      detail: { language, contentLanguage: mount.lang, direction: mount.dir },
    }));
  }

  window.NityaPractice = { setLanguage, get language() { return language; } };
  render();
  notifyLanguage();
})();

  <script>
/* Public adaptation of the NITYA route engine. Choices stay in page memory. */
(() => {
  "use strict";

  const editions = JSON.parse(document.getElementById("nitya-route-copy").textContent);
  const atlas = JSON.parse(document.getElementById("nitya-atlas-copy").textContent);
  const sourceNotice = "язэхъ · показана русская редакция маршрута";

  const aliases = {
    "es-419": "es", pt: "pt-BR", "pt-br": "pt-BR", zh: "zh-Hans", "zh-hans": "zh-Hans", "zh-cn": "zh-Hans",
  };

  function normalizeLanguage(value) {
    const code = typeof value === "string" ? value.trim().toLowerCase() : "";
    return Object.hasOwn(aliases, code) ? aliases[code] : code;
  }

  function element(tag, value, attributes = {}) {
    const node = document.createElement(tag);
    if (value) node.textContent = value;
    for (const [key, attribute] of Object.entries(attributes)) node.setAttribute(key, attribute);
    return node;
  }

  document.querySelectorAll("[data-nitya-route]").forEach((mount, index) => {
    const details = element("details");
    const summary = element("summary");
    const notice = element("p", "", { class: "nitya-route__notice" });
    const panel = element("div", "", { class: "nitya-route__panel" });
    details.append(summary, panel);
    mount.append(notice, details);

    let choices = [];
    let phase = 0;
    let state = "ready";
    let words;
    let controls;

    function phaseAt(index) {
      return index === 1 && choices[0] === "unknown" ? words.unknownRelation : words.phases[index];
    }

    function control(label, action, handler) {
      const button = element("button", label, { type: "button", "data-route-action": action });
      button.addEventListener("click", handler);
      return button;
    }

    function moveTo(next) {
      phase = next;
      state = phase === words.phases.length ? "summary" : "active";
      render(true);
    }

    function recordChoice(id) {
      if (id === choices[phase]) return;
      choices[phase] = id;
      choices.fill(null, phase + 1);
    }

    function render(focus = false) {
      mount.dataset.routeState = state;
      panel.replaceChildren();
      const actions = element("div", "", { class: "nitya-route__actions" });
      let heading;

      if (state === "ready" || state === "closed") {
        const text = state === "ready" ? controls.privacy : controls.closed;
        heading = element("p", text, { tabindex: "-1" });
        panel.append(heading);
        actions.append(control(controls.start, "start", () => {
          choices = Array(words.phases.length).fill(null);
          moveTo(0);
        }));
      } else if (state === "paused") {
        heading = element("h3", controls.paused, { tabindex: "-1" });
        panel.append(heading);
        actions.append(control(controls.resume, "resume", () => moveTo(phase)));
      } else if (state === "summary") {
        heading = element("h3", words.summary, { tabindex: "-1" });
        const list = element("ol");
        words.phases.forEach((_, index) => {
          const step = phaseAt(index);
          const choice = step.choices.find(item => item.id === choices[index]);
          const entry = element("li");
          entry.append(element("strong", step.title), element("p", choice?.result || words.skipped));
          list.append(entry);
        });
        panel.append(heading, list);
        actions.append(control(words.back, "back", () => moveTo(phase - 1)));
      } else {
        const step = phaseAt(phase);
        heading = element("h3", step.title, { tabindex: "-1" });
        const group = element("fieldset");
        group.append(element("legend", step.prompt));
        const next = control(phase === words.phases.length - 1 ? words.finish : words.next, "next", () => moveTo(phase + 1));
        next.disabled = choices[phase] === null;
        for (const choice of step.choices) {
          const label = element("label", "", { class: "nitya-route__choice" });
          const radio = element("input", "", { type: "radio", name: "nitya-route-" + index, value: choice.id });
          radio.checked = choice.id === choices[phase];
          radio.addEventListener("change", () => {
            recordChoice(choice.id);
            next.disabled = false;
          });
          label.append(radio, document.createTextNode(choice.label));
          group.append(label);
        }
        panel.append(heading, group);
        if (phase > 0) actions.append(control(words.back, "back", () => moveTo(phase - 1)));
        actions.append(next, control(words.skip, "skip", () => {
          recordChoice(null);
          moveTo(phase + 1);
        }), control(controls.pause, "pause", () => {
          state = "paused";
          render(true);
        }));
      }

      if (state !== "ready" && state !== "closed") {
        actions.append(control(controls.close, "close", () => {
          state = "closed";
          choices = [];
          phase = 0;
          render(true);
        }));
      }
      panel.append(actions);
      if (focus && details.open) heading.focus();
    }

    function setLanguage(value) {
      const requested = normalizeLanguage(value);
      const language = Object.hasOwn(editions, requested) ? requested : "ru";
      const contentLanguage = language === "es" ? "es-419" : language;
      const direction = contentLanguage === "ar" ? "rtl" : "ltr";
      const wasInPanel = panel.contains(document.activeElement);
      ({ engine: words, labels: controls } = editions[language]);
      mount.lang = contentLanguage;
      mount.dir = direction;
      summary.textContent = words.title;
      const review = editions[language].review || atlas[contentLanguage].review;
      notice.textContent = requested === "yzh" ? sourceNotice : review;
      render(wasInPanel);
    }

    const query = new URLSearchParams(location.search);
    setLanguage(document.documentElement.dataset.practiceLanguage || window.NityaPractice?.language || query.get("lang") || document.documentElement.lang || "ru");
    window.addEventListener("nitya:language", event => setLanguage(event.detail?.language || event.detail));
  });
})();
  </script>

      older: ["senioribus · sine festinatione", "unam quaestionem singulis vicibus lege. clara voce legere, tacite cogitare aut unum versum scribere licet"],
      threads: [
        ["corpus", "quid corpus tuum paulo commodius reddat?"],
        ["rhythmus", "quando hodie tibi utilis sit pausa?"],
        ["sensus", "quem sensum uno verbo nominare velis?"],
        ["donum", "quam artem vel quod parvum auxilium praebere possis?"],
        ["vox", "quid dicere, fingere vel creare velis?"],
        ["experientia", "quid didicisti quod ad gradum proximum eligendum adiuvet?"],
        ["fines", "quae condicio aut quae conventio plus quietis afferat?"],
        ["mundus communis", "quod vinculum cum homine vel loco colere velis?"],
        ["accessus", "quid facilius tibi sit ut particeps fias?"],
        ["lingua", "qua lingua vel quo modo facilius communicas?"],
        ["res privatae", "quid tibi soli servare velis?"],
        ["auxilium", "quid nunc adiuvet: pausa, qui te audiat, parvus gradus, an occasio coetum tibi aptum inveniendi?"],
        ["gradus proximus", "quae parva mutatio hanc hebdomadam tibi faciliorem reddat?"],
      ],
    },
  };

  const aliases = { es: "es-419", "es-419": "es-419", pt: "pt-BR", "pt-br": "pt-BR", zh: "zh-Hans", "zh-cn": "zh-Hans", "zh-hans": "zh-Hans" };

  function normalizeLanguage(value) {
    const code = typeof value === "string" ? value.trim().toLowerCase().replaceAll("_", "-") : "";
    if (Object.hasOwn(aliases, code)) return aliases[code];
    return code === "yzh" || Object.hasOwn(copies, code) ? code : null;
  }

  function element(tag, content, attributes = {}) {
    const node = document.createElement(tag);
    if (content) node.textContent = content;
    for (const [attribute, value] of Object.entries(attributes)) node.setAttribute(attribute, value);
    return node;
  }

  function action(label, id, handler) {
    const button = element("button", label, { type: "button", "data-care-action": id });
    button.addEventListener("click", handler);
    return button;
  }

  let language = normalizeLanguage(window.NityaPractice?.language)
    ?? normalizeLanguage(new URLSearchParams(location.search).get("lang"))
    ?? normalizeLanguage(document.documentElement.dataset.practiceLanguage)
    ?? normalizeLanguage(document.documentElement.lang)
    ?? "ru";
  let opened = false;
  let cleared = false;
  let activeThread = null;
  let context = "general";
  const answers = new Map();

  function clearAnswers() {
    answers.clear();
    activeThread = null;
  }

  function render(focus = null) {
    const contentLanguage = language === "yzh" ? "ru" : language;
    const words = copies[contentLanguage];
    const [contextLabel, general, child, teen, pick, response, another, close, erased, open] = words.ui;

    mount.lang = contentLanguage;
    mount.dir = contentLanguage === "ar" ? "rtl" : "ltr";
    mount.dataset.language = language;
    mount.dataset.careOpen = String(opened);
    mount.dataset.careContext = context;
    const headingId = `${mount.id || "care-questionnaire"}-heading`;
    mount.setAttribute("aria-labelledby", headingId);

    const review = language === "yzh"
      ? "язэхъ · пока показана русская редакция анкеты"
      : words.review;
    const intro = element("div", "", { class: "atlas-care__intro" });
    intro.append(
      element("h2", words.title, { id: headingId }),
      element("p", words.lead),
      element("p", review, { class: "atlas-care__note" }),
    );
    mount.replaceChildren(intro);

    if (!opened) {
      mount.append(action(open, "open", () => {
        opened = true;
        cleared = false;
        render("context");
      }));
      if (cleared) mount.append(element("p", erased, { class: "atlas-care__status", role: "status" }));
      if (focus) mount.querySelector('[data-care-action="open"]').focus();
      return;
    }

    mount.append(element("p", words.privacy, { class: "atlas-care__note" }));
    const contextId = `${mount.id || "care-questionnaire"}-context`;
    const select = element("select", "", { id: contextId });
    for (const [key, label] of [["general", general], ["child", child], ["teen", teen], ["older", words.older[0]]]) {
      select.add(element("option", label, { value: key }));
    }
    select.value = context;
    select.addEventListener("change", () => {
      context = select.value;
      activeThread = null;
      render("context");
    });
    const controls = element("div", "", { class: "atlas-care__controls" });
    controls.append(
      element("label", contextLabel, { for: contextId }),
      select,
      action(close, "close", () => {
        clearAnswers();
        context = "general";
        opened = false;
        cleared = true;
        render("open");
      }),
    );
    mount.append(controls);

    const isYouthContext = context === "child" || context === "teen";
    if (context === "older") mount.append(element("p", words.older[1]));
    const options = element("div", "", { class: "atlas-care__options", role: "group", "aria-label": pick });
    threadIds.forEach((id, index) => {
      const button = action(words.threads[index][0], "thread", () => {
        activeThread = id;
        render("prompt");
      });
      button.dataset.careThread = id;
      button.setAttribute("aria-pressed", String(activeThread === id));
      options.append(button);
    });

    const question = element("div", "", { class: "atlas-care__prompt" });
    if (activeThread) {
      const [label, prompt] = words.threads[threadIds.indexOf(activeThread)];
      const promptHeading = element("h3", isYouthContext ? label : prompt, { tabindex: "-1" });
      question.append(promptHeading);
      if (isYouthContext) {
        question.append(element("p", context === "child" ? words.young : words.teen));
      } else {
        const answerId = `${mount.id || "care-questionnaire"}-answer`;
        const answer = element("textarea", "", {
          class: "atlas-care__answer", id: answerId, maxlength: "240", rows: "3",
          dir: "auto", autocomplete: "off", spellcheck: "false", autocorrect: "off",
        });
        answer.value = answers.get(activeThread) ?? "";
        answer.addEventListener("input", () => answers.set(activeThread, answer.value));
        question.append(element("label", response, { for: answerId }), answer);
      }
      question.append(action(another, "back", () => {
        const previous = activeThread;
        activeThread = null;
        render(previous);
      }));
      mount.append(question);
      if (focus === "prompt") promptHeading.focus();
    } else {
      mount.append(element("p", pick), options);
      if (focus && threadIds.includes(focus)) options.querySelector(`[data-care-thread="${focus}"]`).focus();
    }

    if (focus === "context") select.focus();
  }

  window.addEventListener("nitya:language", (event) => {
    const next = normalizeLanguage(event.detail?.language ?? event.detail);
    if (!next || next === language) return;
    language = next;
    render();
  });

  // Keep the session clear when a page is restored from the browser's back-forward cache.
  window.addEventListener("pagehide", () => {
    if (!opened) return;
    clearAnswers();
    context = "general";
    opened = false;
    render();
  });

  render();
})();
  </script>
</body>
</html>
