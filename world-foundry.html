</script><script>(()=>{'use strict';const data=JSON.parse(document.getElementById('foundry-data').textContent),$=id=>document.getElementById(id),Core=globalThis.SutiWorldFoundry;const codes=Object.keys(data.editions);const norm=x=>{x=String(x||'').toLowerCase();if(x==='es-419')x='es';return codes.includes(x)?x:'ru'};let lang=norm(new URLSearchParams(location.search).get('lang')),blueprint=null;const themes=['day','night','contrast'];const make=(t,x)=>{const n=document.createElement(t);if(x!==undefined)n.textContent=x;return n};const save=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};try{if(!new URLSearchParams(location.search).has('lang'))lang=norm(localStorage.getItem('suti-locale'));const t=localStorage.getItem('suti-theme');if(themes.includes(t))document.documentElement.dataset.theme=t}catch{}const labels=()=>data.editions[lang],common=()=>data.common[lang].ui;const names={ru:'Русский',en:'English',es:'Español','pt-br':'Português brasileiro','zh-hans':'简体中文',hi:'हिन्दी',fr:'Français',ar:'العربية',bn:'বাংলা',eo:'Esperanto',sa:'संस्कृतम्',la:'Latina',yzh:'язэхъ · RU'};for(const c of codes){const o=make('option',names[c]);o.value=c;$('language').append(o)}function preview(){if(!blueprint)return;const svg=$('preview');svg.replaceChildren();const ns='http://www.w3.org/2000/svg';const title=document.createElementNS(ns,'title');title.id='preview-title';title.textContent=blueprint.title;svg.append(title);const scale=260/blueprint.width;for(const o of blueprint.objects){if(!o.module_id)continue;const x=210+o.position[0]*scale,y=160+o.position[2]*scale;const rect=document.createElementNS(ns,'rect');rect.setAttribute('x',String(x-23));rect.setAttribute('y',String(y-23));rect.setAttribute('width','46');rect.setAttribute('height','46');rect.setAttribute('rx','6');svg.append(rect);const text=document.createElementNS(ns,'text');text.setAttribute('x',String(x));text.setAttribute('y',String(y+4));text.textContent=o.module_id.split('.')[1];svg.append(text)}$('rooms').replaceChild
