name: publish suti.world

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: configure pages
        uses: actions/configure-pages@v5
      - name: prepare public surface
        run: |
          mkdir -p _site/assets/fonts/onest
          cp index.html _site/index.html
          cp assets/fonts/onest/regular.woff2 _site/assets/fonts/onest/regular.woff2
          cp assets/fonts/onest/OFL.txt _site/assets/fonts/onest/OFL.txt
          for route in ru es pt essence ru/essence es/essence pt/essence; do
            mkdir -p "_site/$route"
            relative="../"
            if [[ "$route" == */* ]]; then relative="../../"; fi
            case "$route" in
              es*) lang="es"; message="SUTI.world se ha actualizado. Ir a la práctica gratuita." ;;
              pt*) lang="pt"; message="SUTI.world foi atualizado. Ir para a prática gratuita." ;;
              ru*) lang="ru"; message="SUTI.world обновлён. Перейти к бесплатной практике." ;;
              *) lang="en"; message="SUTI.world has changed. Go to the free practice." ;;
            esac
            cat > "_site/$route/index.html" <<EOF
          <!doctype html>
          <html lang="$lang"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=${relative}#practice"><title>SUTI.world</title></head><body><p>$message</p><p><a href="${relative}#practice">SUTI.world · ${message}</a></p></body></html>
          EOF
          done
      - name: upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
