function updateURL(){try{const url=new URL(location.href);url.searchParams.set('lang',language);url.searchParams.set('theme',theme);if(url.hash&&!selectedModule())url.hash='';history.replaceState(history.state,'',url);}catch{/* Reading remains available without history access. */}}
function renderShell(){const edition=editions[language];document.documentElement.lang=edition.locale==='yzh'?'ru':edition.locale;document.documentElement.dir=edition.direction;document.title=edition.title+' · SUTI.world';$('portal-title').textContent=edition.title;$('prototype-note').textContent=edition.statusNote;$('language-status').textContent=language==='yzh'?edition.ui.yzhNote:edition.ui.sourceDraft;$('language-label').textContent=edition.ui.language;$('portal-language').value=language;$('atlas-back').href='../../world-atlas.html?lang='+encodeURIComponent(language);$('standalone').textContent=edition.ui.room+' ↗';$('standalone').href=sourceHref();$('source-link').textContent=edition.ui.source;frame.title=edition.ui.room+' · '+edition.title;updateURL();}
function syncFrameLanguage(){if(!innerLocale)return;const wanted=editions[language].locale;if(innerLocale.value===wanted)return;syncingLanguage=true;try{innerLocale.value=wanted;innerLocale.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));}finally{syncingLanguage=false;}}
function setLanguage(next){const slug=normalize(next);if(!slug)return;language=slug;renderShell();syncFrameLanguage();save('suti-locale',language);}
const tokenMap={'--bg':'--suti-angel-paper','--paper':'--suti-angel-card','--ink':'--suti-angel-ink','--line':'--suti-angel-petrol','--accent':'--suti-angel-focus'};
function applyFrameSkin(){try{const doc=frame.contentDocument;if(!doc||!doc.head)return;doc.documentElement.dataset.theme=theme;let style=doc.getElementById('suti-portal-theme-skin');if(!style){style=doc.createElement('style');style.id='suti-portal-theme-skin';doc.head.append(style);}const computed=getComputedStyle(document.body),values=[];for(const [target,source]of Object.entries(tokenMap)){const color=computed.getPropertyValue(source).trim();if(/^(?:#[0-9a-f]{3,8}|rgba?\([0-9.,% /]+\)|[a-z]+)$/i.test(color))values.push(target+':'+color);}style.textContent=':root{'+values.join(';')+'}body{font-family:"SUTI Manrope",Manrope,system-ui,sans-serif}h1,h2,h3,h4{font-family:"SUTI Nunito","Nunito Sans",system-ui,sans-serif}';}catch{/* Native standalone source stays usable when frame access is restricted. */}}
function setTheme(next,persist=true){if(!themes.includes(next))return;theme=next;document.documentElement.dataset.theme=theme;for(const button of document.querySelectorAll('[data-theme-choice]'))button.setAttribute('aria-pressed',String(button.dataset.themeChoice===theme));applyFrameSkin();updateURL();if(persist)save('suti-theme',theme);}
for(const slug of slugs){const option=document.createElement('option');option.value=slug;option.textContent=names[slug];$('portal-language').append(option);}
$('portal-language').addEventListener('change',event=>setLanguage(event.target.value));
for(const button of document.querySelectorAll('[data-theme-choice]'))button.addEventListener('click',()=>setTheme(button.dataset.themeChoice));
window.addEventListener('storage',event=>{if(event.key==='suti-theme')setTheme(event.newValue,false);if(event.key==='suti-locale'&&normalize(event.newValue))setLanguage(event.newValue);});
frame.addEventListener('load',()=>{innerLocale=null;try{const doc=frame.contentDocument;if(!doc)return;innerLocale=doc.getElementById('locale');if(innerLocale)innerLocale.addEventListener('change',()=>{if(syncingLanguage)return;const next=normalize(innerLocale.value);if(next){language=next;renderShell();save('suti-locale',language);}});syncFrameLanguage();applyFrameSkin();const module=selectedModule();if(module){const anchor=doc.getElementById(module);if(anchor)anchor.scrollIntoView({block:'start'});}}catch{$('portal-message').textContent=editions[language].ui.error+' · FRAME_ACCESS';}});
window.addEventListener('hashchange',()=>{const module=selectedModule();if(!module)return;try{frame.contentDocument?.getElementById(module)?.scrollIntoView({block:'start'});}catch{/* Optional guide anchors never control workshop records. */}});
renderShell();setTheme(theme,false);frame.src=sourceHref();
</script>
</body></html>
