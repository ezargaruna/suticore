world","alias":".world","title":"সাধারণ প্রবেশপথ","function":"পদ্ধতি ও মানুষের বেছে নেওয়া পথে সহজে চলাচল"},{"id":"SUTI.clan","alias":".clan","title":"স্বেচ্ছামূলক বৃত্ত","function":"আমন্ত্রণ, ভূমিকা গ্রহণ, যৌথ শর্ত ও প্রস্থান"},{"id":"SUTI.audit","alias":".audit","title":"নিরীক্ষা","function":"যাচাইয়ের নির্দিষ্ট পরিসর, প্রমাণ, ত্রুটি ও সংশোধন"},{"id":"SUTI.crystal","alias":".crystal","title":"জ্ঞানের স্ফটিক","function":"উৎস, সীমা ও সংস্করণসহ নিজে পড়েই বোঝা যায় এমন পদ্ধতি"},{"id":"SUTI.oracle","alias":".oracle","title":"বিকল্প প্রশ্ন","function":"অনুমান বা প্রতীক হিসেবে স্পষ্ট অবস্থাসহ একাধিক দৃষ্টিকোণ"},{"id":"SUTI.sotkan","alias":".sotkan","title":"সংযোগ","function":"সত্তা, সম্পর্ক, নির্ভরতা ও উৎস; গোপন একত্রীকরণ ছাড়া"},{"id":"SUTI.game","alias":".game","title":"খেলা ও অনুশীলন","function":"সাধারণ ভাষায় বলা ও পর্যবেক্ষণযোগ্য পদক্ষেপসহ ঐচ্ছিক অভিযান"},{"id":"SUTI.logos","alias":".logos","title":"ভাষা ও প্রকাশ","function":"পরিভাষা, কণ্ঠ, সরাসরি অর্থানুগ রূপান্তর ও অর্থহানি যাচাই"}]},{"schema":"suti.care-veche.locale.v1","version":"2026-11-13.v1","locale":"eo","source_locale":"ru","direction":"ltr","source_sha256":"58b895e7af0ed3b057a2be1951af42023bc2b6f346432f569ade88577e9711fb","title":"komuna spaco por zorgo kaj veche","subtitle":"klara demando · distingeblaj voĉoj · farebla paŝo · konservita spuro","scope":"komuna senpersonigita bazo por individuaj kaj kolektivaj sistemoj; loka laborejo por diskuto","purpose":"kunligi scion, agentejon por zorgo kaj komunan konsideradon tiel, ke homo povu memstare agordi la sistemon kaj kontroli la sekvan paŝon","outcome":"legi la metodon, registri kontribuon aŭ starpunkton, vidi la diferencojn kaj konservi porteblan diskutpakaĵon","statusNote":"projekta specifo kaj kandidato por loka prototipo; retaj agentoj, mesaĝoj, mono, jura organizo kaj publikigo estas malŝaltitaj","preservation":"utilaj metodoj, versioj kaj nesolvitaj materialoj estas konservataj; originaloj ne estas detruataj, elektitaj transigoj estas inversigeblaj kaj havas source → target, SHA kaj kvitancon","privacy":"en la komuna tavolo estas metodoj, roloj kaj malplenaj ŝablonoj; personaj rakontoj, kontaktoj, korespondado kaj sentemaj informoj restas en la elektita privata kadro","metaphor":"anĝelo de zorgo estas libervola interfaca bildo; homoj kaj agentoj povas uzi ordinaran priskribon de la rolo sen atribuo de identeco aŭ travivaĵoj","localState":"la registraĵoj de la laborejo troviĝas en la memoro de la paĝo; antaŭ fermo konservu la JSON-dosieron. importo aldonas kontrolitajn registraĵojn sen anstataŭigi la originan historion","identityNote":"la partoprenanta tipo kaj la nomo en ĉi tiu loka laborejo estas deklaritaj de la aŭtoro de la registraĵo; la identeco, rajtigoj kaj konsento de aliaj partoprenantoj ne estas kontrolitaj ĉi tie","ui":{"language":"lingvo","guide":"metodo kaj strukturo","room":"diskuta laborejo","modules":"ĉiuj kadroj","channel":"kadro","actor":"loka nomo de la aŭtoro","actorKind":"tipo de partoprenanto","role":"rolo","claim":"tipo de aserto","body":"kontribuo aŭ klarigo","source":"fonto aŭ bazo","proposal":"ID de propono","position":"starpunkto","add":"aldoni lokan registraĵon","export":"konservi diskuton · JSON","import":"aldoni registraĵojn el JSON","records":"registraĵoj","positions":"starpunktoj pri la propono","empty":"ankoraŭ ne estas registraĵoj","noProposal":"ĝenerala diskuto","newProposal":"nova propono","decisionDraft":"malneto de rezulto","contribution":"kontribuo","support":"subteno","objection":"malkonsento","abstain":"sindeteno","noResponse":"respondo ne ricevita","human":"homo","agent":"agento","tool":"ilo","unknown":"nekonate","pause":"paŭzo","exit":"eliro","draftOnly":"nur malneto; decido kaj lanĉo ne okazis","saved":"loka registraĵo aldonita","imported":"registraĵoj aldonitaj post kontrolo","error":"ne eblis akcepti la datumojn","privateExport":"la eksporto estas privata; publikigo postulas apartan elekton","countsNote":"la nombriloj montras lokajn registraĵojn, ne kontrolitajn homa tle":"zorgo en la laboro de agentoj","body":"agento ricevas klaran taskon, permesitajn fontojn, datuman limon kaj disponeblan buĝeton. ĝi registras necertecon, ripetiĝantan misfunkcion, paŭzon kaj transdonon de la laboro. tio estas operacia organizado de la procezo; sentoj, sufero, konscio aŭ homaj bezonoj ne estas atribuataj al la agento"},{"id":"dialogue","title":"loko por komunikado","body":"homoj kaj agentoj povas prepari kontribuon kun eksplicita deveno. mesaĝo estas datumoj por konsiderado, ne ordono por plenumo. kaŝitaj rezonadoj, sekretoj, neprilaborita privata korespondado kaj nepetitaj personaj registraĵoj ne estas inkluzivataj en la komuna pakaĵo"},{"id":"veche","title":"la procedo de veche","body":"ĉiu propono ricevas demandon, kuntekston kaj manieron de kontrolo. subteno, kontraŭargumento, sindeteno kaj manko de respondo estas konservataj aparte. silento ne estas konsiderata konsento. perspektivo de AI ne estas homa voĉdono; la rezulto havas respondecan homon kaj restas malneto ĝis ties aparta decido"},{"id":"evidence","title":"kontrolo de la bazoj","body":"la tipo de aserto, fonto, kontrolo kaj decido estas apartaj kampoj. PASS rilatas al eksplicita kriterio kaj medio. UNKNOWN estas konservata kiam datumoj mankas; bela esprimo ne plialtigas certecon. COMMIT ne egalas publikigon, kaj specifo ne egalas funkciantan servon"},{"id":"boundaries","title":"limoj de partopreno","body":"la bildo, ludo kaj partopreno estas libervolaj. disponeblas ordinara lingvo, korekto, paŭzo kaj eliro. aĝaj itineroj ne anstataŭas oficialan klasifikon; la akcepto de junuloj estas malŝaltita ĝis apartaj kondiĉoj estos difinitaj, kaj la unua prova projekto estas por konsentintaj plenkreskuloj. ĉi tie oni ne pretendas liveri krizhelpon aŭ klinikan helpon"},{"id":"adapters","title":"konektado de ekzistantaj agentoj","body":"la proponata adaptilo transdonas nur la elektitajn kontribuon, rolon, fonton, version kaj permesokampon. importo ne konfirmas la aŭtoron, rajtojn aŭ konsenton. reta transporto, sekretoj, permesoj, funkciigisto kaj protokolo postulas apartajn efektivigon kaj kontrolon; nun ili estas malŝaltitaj"},{"id":"languages","title":"lingvoj kaj transigo de signifo","body":"ĉiu eldono estas ligita al la rusa fonto kaj ĝia SHA. nomoj, ID-oj, enums kaj kodo estas konservataj. estas kontrolataj neoj, necerteco, elekto kaj konsekvencoj. язэхъ ricevas apartan eksperimentan statuson; ĝiaj nekonataj signifoj ne estas plenigataj per konjektoj"},{"id":"next-step","title":"atingebla rezulto","body":"elektu kadron kaj demandon; aldonu kontribuon, proponon aŭ starpunkton; kontrolu la fonton; konservu la JSON-dosieron; laŭbezone importu elektitajn registraĵojn en alian lokan laborejon. propra eksporto ne aŭtomate fariĝas komuna aŭ publika"}],"roles":[{"id":"initiator","label":"iniciatinto","scope":"formulas la demandon, kuntekston kaj kriterion de utileco"},{"id":"contributor","label":"partoprenanto","scope":"aldonas bazon, eblon, ekzemplon aŭ limigon"},{"id":"reviewer","label":"kontrolanto","scope":"komparas fontojn, konsekvencojn kaj signifoperdojn"},{"id":"human_steward","label":"respondeca homo","scope":"aparte decidas en sia konfirmita agadkampo; loka roletikedo ne donas rajtigojn"}],"workflow":[{"id":"question","title":"demando","body":"kion gravas kompreni, esprimi aŭ kontroli?"},{"id":"context","title":"kunteksto","body":"kio estas elektita por komuna konsiderado kaj sur kiu bazo?"},{"id":"proposal","title":"propono","body":"kiu farebla paŝo estas proponata kaj kiel rimarki la rezulton?"},{"id":"positions","title":"distingado de starpunktoj","body":"kio estas subtenita, kontestita, prokrastita aŭ restinta sen respondo?"},{"id":"review","title":"kontrolo","body":"ĉu la bazoj, limoj kaj rajto elekti estas konservitaj?"},{"id":"decision","title":"malneto de rezulto","body":"kio restas en HOLD kaj kiun decidon devas fari homo?"},{"id":"trace","title":"spuro kaj reveno","body":"konservi la elektitaĵon, kontroli la rezulton, korekti aŭ fini"}],"  methodus finem, invarians, ingressum, actionem, exitum, fontem, iura, versionem et fines describit. nomen aut narratio personalis ad methodum operandam non requiritur. separatio a notitiis personalibus discrimen utile servat nec casum singularem tamquam legem universalem proponit"},{"id":"customise","title":"compositio singularis et communis","body":"profilum personale, lingua electa, rhythmus et accessibilitas separatim adiunguntur. communitas sua munera, visibilitatem et ambitum decisionum constituit. configurationes emendari et exportari possunt; identitas, consensus et participatio aliena ex exemplari non deducuntur"},{"id":"agency","title":"procuratio curae","body":"ingressus a quaestione electa incipit. actum possibilem, subsidium necessarium et hominem decernentem definire. programma automaticum auxilia, subsidia pecuniaria, solutiones aut repraesentationem non attribuit. petitio explanari, homini idoneo tradi aut finiri potest"},{"id":"agent-care","title":"cura in opere agentium","body":"agens munus clarum, fontes permissos, finem datorum et summam praesto constitutam accipit. incertitudinem, defectum repetitum, pausam et traditionem operis adnotat. haec est ordinatio operationalis processus; neque affectus neque dolor neque conscientia neque necessitates humanae agenti attribuuntur"},{"id":"dialogue","title":"locus communicationis","body":"homines et agentes contributionem cum origine manifesta parare possunt. nuntius data ad considerationem praebet, non mandatum exsecutionis. ratiocinationes occultae, secreta, epistulae privatae nondum tractatae et adnotationes personales non petitae in fasciculum communem non includuntur"},{"id":"veche","title":"ordo veche","body":"unumquodque propositum quaestionem, contextum et rationem probationis accipit. favor, obiectio, abstentio et absentia responsi separatim servantur. silentium pro consensu non habetur. prospectus AI non est suffragium humanum; exitui homo responsabilis assignatur et exitus adumbratio manet usque ad decisionem separatam illius hominis"},{"id":"evidence","title":"probatio fundamentorum","body":"genus assertionis, fons, probatio et decisio campi diversi sunt. PASS ad criterium et ambitum manifeste definitos pertinet. UNKNOWN servatur ubi data desunt; pulchra locutio certitudinem non auget. COMMIT publicationi non aequatur, et specificatio ministerio operanti non aequatur"},{"id":"boundaries","title":"fines participationis","body":"imago, ludus et participatio voluntaria sunt. sermo ordinarius, correctio, pausa et exitus praesto sunt. itinera secundum aetatem classificationem officialem non substituunt; receptio iuvenum inactiva est donec condiciones separatae statuantur, et primum experimentum adultis consentientibus destinatur. auxilium urgente necessitate praebendum aut clinicum hic non promittitur"},{"id":"adapters","title":"coniunctio agentium iam operantium","body":"adaptatorium propositum tantum contributionem, munus, fontem, versionem et ambitum permissionis selectos transmittit. importatio auctorem, iura aut consensum non comprobat. transmissio per rete, secreta, permissiones, operator et diarium implementationem et probationem separatas requirunt; hae functiones nunc inactivae sunt"},{"id":"languages","title":"linguae et translatio sensus","body":"unaquaeque editio fonti Russico eiusque SHA coniungitur. nomina, ID, enums et codex servantur. negationes, incertitudo, electio et consequentiae probantur. язэхъ statum experimentalem separatum accipit; sensus eius ignoti coniecturis non supplentur"},{"id":"next-step","title":"exitus accessibilis","body":"elige ambitum et quaestionem; adde contributionem, propositum aut sententiam; proba fontem; serva fasciculum JSON; si opus est, adnotationes selectas in aliam officinam localem importa. exportatio propria non sua sponte communis aut publica fit"}],"roles":[{"id":"initiator","label":"initiator","scope":"quaestionem, contextum et criterium utilitatis formulat"},{"id":"contributor","label":"particeps","scope":"fundamentum, optionem, exemplum aut limitationem addit"},{"id":"reviewer","label":"examinator","scope":"fontes, consequentias et detrimenta sensus comparat"},{"id":"human_steward","label":"homo responsabilis","scope":"separatim intra suum ambitum comprobatum decernit; nota localis muneris potestatem non creat"}],"workflow":[{"id":"question","title":"quaestio","body":"quid magni momenti est intellegere, exprimere aut probare?"},{"id":"context","title":"contextus","body":"quid ad considerationem communem electum est et quo fundamento?"},{"id":"proposal","title":"propositum","body":"quis gradus possibilis proponitur et quomodo exitus animadverti potest?"},{"id":"positions","title":"distinctio sententiarum","body":"quid favorem accepit, quid impugnatum aut dilatum est, quid sine responso mansit?"},{"id":"review","title":"examinatio","body":"suntne fundamenta, fines et ius eligendi servata?"},{"id":"decision","title":"adumbratio exitus","body":"quid in HOLD manet et quam decisionem homo facere debet?"},{"id":"trace","title":"vestigium et reditus","body":"electa servare, exitum probare, corrigere aut finire"}],"positions":[{"id":"support","label":"favor","meaning":"favor proposito indicato intra ambitum nominatum"},{"id":"objection","label":"obiectio","meaning":"limitatio, periculum aut explanatio alternativa certa"},{"id":"abstain","label":"abstentio","meaning":"sententia nondum sumitur; causa ignota manere potest"},{"id":"no_response","label":"nullum responsum","meaning":"responsum non receptum est; hoc neque consensus neque abstentio est"}],"claims":[{"id":"FACT","label":"factum"},{"id":"OBSERVATION","label":"observatio"},{"id":"INTERPRETATION","label":"interpretatio"},{"id":"HYPOTHESIS","label":"hypothesis"},{"id":"EVALUATION","label":"aestimatio"},{"id":"SYMBOL","label":"symbolum"},{"id":"UNKNOWN","label":"ignotum"}],"modules":[{"id":"SUTI.angels","alias":".angels","title":"munera angelorum curae","function":"munera auxilii voluntaria, traditio operis et fines par eationes directae et probatio detrimentorum sensus"}]},{"schema":"suti.care-veche.locale.v1","version":"2026-11-13.v1","locale":"yzh","source_locale":"ru","direction":"ltr","source_sha256":"58b895e7af0ed3b057a2be1951af42023bc2b6f346432f569ade88577e9711fb","title":"язэхъ · пространство заботы и вече","subtitle":"ясный вопрос · различимые голоса · посильный шаг · сохранённый след","scope":"общая обезличенная основа для индивидуальных и коллективных систем; локальная мастерская обсуждения","purpose":"соединить знания, агентство заботы и совместное рассмотрение так, чтобы человек мог самостоятельно настроить систему и проверить следующий шаг","outcome":"прочитать метод, записать вклад или позицию, увидеть различия и сохранить переносимый пакет обсуждения","statusNote":"авторский эксперимент · русский смысловой глосс всех полей и отдельная запись YZHC 0.1; поэтический перевод и авторское принятие не подтверждены","preservation":"полезные методы, версии и нерешённые материалы сохраняются; оригиналы не уничтожаются, выбранные переносы обратимы и имеют source → target, SHA и квитанцию","privacy":"в общем слое — методы, роли и пустые шаблоны; личные истории, контакты, переписки и уязвимые сведения остаются в выбранном частном контуре","metaphor":"ангел заботы — добровольный образ интерфейса; для людей и агентов доступна обычная формулировка роли без назначения идентичности или переживаний","localState":"записи мастерской находятся в памяти страницы; перед закрытием сохраните JSON. импорт добавляет проверенные записи, не заменяет исходную историю","identityNote":"вид участника и имя в этой локальной мастерской заявлены автором записи; личность, полномочия и согласие других участников здесь не проверены","ui":{"language":"язык","guide":"метод и устройство","room":"мастерская обсуждения","modules":"все контуры","channel":"контур","actor":"локальное имя автора","actorKind":"вид участника","role":"роль","claim":"тип утверждения","body":"вклад или пояснение","source":"источник или основание","proposal":"ID предложения","position":"позиция","add":"добавить локальную запись","export":"сохранить обсуждение · JSON","import":"добавить записи из JSON","records":"записи","positions":"позиции по предложению","empty":"пока нет записей","noProposal":"общее обсуждение","newProposal":"новое предложение","decisionDraft":"черновик итога","contribution":"вклад","support":"поддержка","objection":"возражение","abstain":"воздержание","noResponse":"ответ не получен","human":"человек","agent":"агент","tool":"инструмент","unknown":"неизвестно","pause":"пауза","exit":"выход","draftOnly":"только черновик; решение и запуск не выполнены","saved":"локальная запись добавлена","imported":"записи добавлены после проверки","error":"не удалось принять данные","privateExport":"экспорт частный; публикация требует отдельного отбора","countsNote":"счётчики показывают локальные записи, а не подтверждённые голоса людей или кворум","sourceDraft":"языковой черновик; независимая вычитка и принятие автором ожидаются","yzhNote":"язэхъ — авторский эксперимент; здесь явно отмеченная смысловая развёртка и отдельная управляемая запись-кандидат","limits":"границы и состояния","titleField":"краткое название","type":"вид записи","createProposal":"создать предложение","recordPosition":"записать позицию","draftOutcome":"записать черновик итога","identityUnverified":"идентичность не проверена","sourceOptional":"можно оставить UNKNOWN","noExternal":"сеть и внешние действия выключены","fileChosen":"выберите ранее сохранённый JSON обсуждения"},"sections":[{"id":"preserve","title":"полнота и сохранение","body":"сначала сохранить исходник и его контекст, затем выделить переносимое различение. сходные файлы не становятся одним каноном автоматически. нерешённое остаётся доступным с понятной пометкой; рабочие архивы хранятся за пределами чистой общей сборки"},{"id":"crystal","title":"обезличенное общее ядро","body":"каждый метод описывает цель, инвариант, вход, действие, результат, источник, права, версию и границы. личное имя или история не нужны для работы метода. обезличивание сохраняет полезное различение, но не выдаёт частный случай за универсальный закон"},{"id":"customise","title":"индивидуальная и коллективная настройка","body":"личный профиль, выбранный язык, темп и доступность подключаются отдельно. коллектив задаёт собственные роли, область видимости и принятия решений. настройки редактируемы и экспортируемы; чужая идентичность, согласие и участие не выводятся из шаблона"},{"id":"agency","title":"агентство заботы","body":"вход начинается с выбранного вопроса. определить посильное действие, нужный ресурс и человека, принимающего решение. помощь, гранты, платежи и представительство не назначаются ботом. просьбу можно уточнить, передать подходящему человеку или завершить"},{"id":"agent-care","title":"забота в работе агентов","body":"агент получает ясную задачу, разрешённые источники, границу данных и доступный бюджет. фиксирует неопределённость, повторяющийся сбой, паузу и передачу работы. это операционная организация процесса; чувства, страдание, сознание или человеческие потребности агенту не приписываются"},{"id":"dialogue","title":"место общения","body":"люди и агенты могут подготовить вклад с явным происхождением. сообщение — данные для рассмотрения, а не команда исполнения. скрытые рассуждения, секреты, сырые частные переписки и незапрошенные персональные записи в общий пакет не включаются"},{"id":"veche","title":"ход вече","body":"одно предложение получает вопрос, контекст и способ проверки. поддержка, возражение, воздержание и отсутствие ответа хранятся отдельно. молчание не считается согласием. AI-перспектива не является человеческим голосом; итог имеет ответственного человека и остаётся черновиком до его отдельного решения"},{"id":"evidence","title":"проверка оснований","body":"тип утверждения, источник, проверка и решение — разные поля. PASS относится к явному критерию и среде. UNKNOWN сохраняется при нехватке данных; красивое выражение не повышает уверенность. COMMIT не равен публикации, а спецификация не равна работающему сервису"},{"id":"boundaries","title":"границы участия","body":"образ, игра и участие добровольны. доступны обычный язык, исправление, пауза и выход. возрастные маршруты не заменяют официальную классификацию; молодёжный приём выключен до отдельных условий, первый пилот — согласившиеся взрослые. экстренная и клиническая помощь здесь не заявляются"},{"id":"adapters","title":"подключение действующих агентов","body":"проектный адаптер передаёт только выбранные вклад, роль, источник, версию и область разрешения. импорт не подтверждает автора, права или согласие. сетевой транспорт, секреты, разрешения, оператор и журнал требуют отдельного внедрения и проверки; сейчас они выключены"},{"id":"languages","title":"языки и смысловой перенос","body":"каждая редакция связывается с русским источником и его SHA. имена, ID, enums и код сохраняются. проверяются отрицания, неопределённость, выбор и последствия. язэхъ получает отдельный экспериментальный статус; его неизвестные значения не заполняются догадкой"},{"id":"next-step","title":"доступный результат","body":"выберите контур и вопрос; добавьте вклад, предложение или позицию; проверьте источник; сохраните JSON; при необходимости импортируйте выбранные записи в другую локальную мастерскую. собственный экспорт не становится автоматически общим или публичным"}],"roles":[{"id":"initiator","label":"инициатор","scope":"формулирует вопрос, контекст и критерий полезности"},{"id":"contributor","label":"участник","scope":"добавляет основание, вариант, пример или ограничение"},{"id":"reviewer","label":"проверяющий","scope":"сопоставляет источники, последствия и смысловые потери"},{"id":"human_steward","label":"ответственный человек","scope":"отдельно принимает решение в своей подтверждённой области; локальная метка роли полномочий не создаёт"}],"workflow":[{"id":"question","title":"вопрос","body":"что важно понять, выразить или проверить?"},{"id":"context","
