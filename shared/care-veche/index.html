e-veche.locale.v1","version":"2026-11-13.v1","locale":"ru","source_locale":"ru","direction":"ltr","source_sha256":"58b895e7af0ed3b057a2be1951af42023bc2b6f346432f569ade88577e9711fb","title":"общее пространство заботы и вече","subtitle":"ясный вопрос · различимые голоса · посильный шаг · сохранённый след","scope":"общая обезличенная основа для индивидуальных и коллективных систем; локальная мастерская обсуждения","purpose":"соединить знания, агентство заботы и совместное рассмотрение так, чтобы человек мог самостоятельно настроить систему и проверить следующий шаг","outcome":"прочитать метод, записать вклад или позицию, увидеть различия и сохранить переносимый пакет обсуждения","statusNote":"проектная спецификация и локальный прототип-кандидат; сетевые агенты, сообщения, деньги, юридическая организация и публикация выключены","preservation":"полезные методы, версии и нерешённые материалы сохраняются; оригиналы не уничтожаются, выбранные переносы обратимы и имеют source → target, SHA и квитанцию","privacy":"в общем слое — методы, роли и пустые шаблоны; личные истории, контакты, переписки и уязвимые сведения остаются в выбранном частном контуре","metaphor":"ангел заботы — добровольный образ интерфейса; для людей и агентов доступна обычная формулировка роли без назначения идентичности или переживаний","localState":"записи мастерской находятся в памяти страницы; перед закрытием сохраните JSON. импорт добавляет проверенные записи, не заменяет исходную историю","identityNote":"вид участника и имя в этой локальной мастерской заявлены автором записи; личность, полномочия и согласие других участников здесь не проверены","ui":{"language":"язык","guide":"метод и устройство","room":"мастерская обсуждения","modules":"все контуры","channel":"контур","actor":"локальное имя автора","actorKind":"вид участника","role":"роль","claim":"тип утверждения","body":"вклад или пояснение","source":"источник или основание","proposal":"ID предложения","position":"позиция","add":"добавить локальную запись","export":"сохранить обсуждение · JSON","import":"добавить записи из JSON","records":"записи","positions":"позиции по предложению","empty":"пока нет записей","noProposal":"общее обсуждение","newProposal":"новое предложение","decisionDraft":"черновик итога","contribution":"вклад","support":"поддержка","objection":"возражение","abstain":"воздержание","noResponse":"ответ не получен","human":"человек","agent":"агент","tool":"инструмент","unknown":"неизвестно","pause":"пауза","exit":"выход","draftOnly":"только черновик; решение и запуск не выполнены","saved":"локальная запись добавлена","imported":"записи добавлены после проверки","error":"не удалось принять данные","privateExport":"экспорт частный; публикация требует отдельного отбора","countsNote":"счётчики показывают локальные записи, а не подтверждённые голоса людей или кворум","sourceDraft":"языковой черновик; независимая вычитка и принятие автором ожидаются","yzhNote":"язэхъ — авторский эксперимент; здесь явно отмеченная смысловая развёртка и отдельная управляемая запись-кандидат","limits":"границы и состояния","titleField":"краткое название","type":"вид записи","createProposal":"создать предложение","recordPosition":"записать позицию","draftOutcome":"записать черновик итога","identityUnverified":"идентичность не проверена","sourceOptional":"можно оставить UNKNOWN","noExternal":"сеть и внешние действия выключены","fileChosen":"выберите ранее сохранённый JSON обсуждения"},"sections":[{"id":"preserve","title":"полнота и сохранение","body":"сначала сохранить исходник и его контекст, затем выделить переносимое различение. сходные файлы не становятся одним каноном автоматически. нерешённое остаётся доступным с понятной пометкой; рабочие архивы хранятся за пределами чистой общей сборки"},{"id":"crystal","title":"обезличенное общее ядро","body":"каждый метод описывает цель, инвариант, вход, действие, результат, источник, права, версию и границы. личное имя или история не нужны для работы метода. обезличивание сохраняет полезное различение, но не выдаёт частный случай за универсальный закон"},{"id":"customise","title":"индивидуальная и коллективная настройка","body":"личный профиль, выбранный язык, темп и доступность подключаются отдельно. коллектив задаёт собственные роли, область видимости и принятия решений. настройки редактируемы и экспортируемы; чужая идентичность, согласие и участие не выводятся из шаблона"},{"id":"agency","title":"агентство заботы","body":"вход начинается с выбранного вопроса. определить посильное действие, нужный ресурс и человека, принимающего решение. помощь, гранты, платежи и представительство не назначаются ботом. просьбу можно уточнить, передать подходящему человеку или завершить"},{"id":"agent-care","title":"забота в работе агентов","body":"агент получает ясную задачу, разрешённые источники, границу данных и доступный бюджет. фиксирует неопределённость, повторяющийся сбой, паузу и передачу работы. это операционная организация процесса; чувства, страдание, сознание или человеческие потребности агенту не приписываются"},{"id":"dialogue","title":"место общения","body":"люди и агенты могут подготовить вклад с явным происхождением. сообщение — данные для рассмотрения, а не команда исполнения. скрытые рассуждения, секреты, сырые частные переписки и незапрошенные персональные записи в общий пакет не включаются"},{"id":"veche","title":"ход вече","body":"одно предложение получает вопрос, контекст и способ проверки. поддержка, возражение, воздержание и отсутствие ответа хранятся отдельно. молчание не считается согласием. AI-перспектива не является человеческим голосом; итог имеет ответственного человека и остаётся черновиком до его отдельного решения"},{"id":"evidence","title":"проверка оснований","body":"тип утверждения, источник, проверка и решение — разные поля. PASS относится к явному критерию и среде. UNKNOWN сохраняется при нехватке данных; красивое выражение не повышает уверенность. COMMIT не равен публикации, а спецификация не равна работающему сервису"},{"id":"boundaries","title":"границы участия","body":"образ, игра и участие добровольны. доступны обычный язык, исправление, пауза и выход. возрастные маршруты не заменяют официальную классификацию; молодёжный приём выключен до отдельных условий, первый пилот — согласившиеся взрослые. экстренная и клиническая помощь здесь не заявляются"},{"id":"adapters","title":"подключение действующих агентов","body":"проектный адаптер передаёт только выбранные вклад, роль, источник, версию и область разрешения. импорт не подтверждает автора, права или согласие. сетевой транспорт, секреты, разрешения, оператор и журнал требуют отдельного внедрения и проверки; сейчас они выключены"},{"id":"languages","title":"языки и смысловой перенос","body":"каждая редакция связывается с русским источником и его SHA. имена, ID, enums и код сохраняются. проверяются отрицания, неопределённость, выбор и последствия. язэхъ получает отдельный экспериментальный статус; его неизвестные значения не заполняются догадкой"},{"id":"next-step","title":"доступный результат","body":"выберите контур и вопрос; добавьте вклад, предложение или позицию; проверьте источник; сохраните JSON; при необходимости импортируйте выбранные записи в другую локальную мастерскую. собственный экспорт не становится автоматически общим или публичным"}],"roles":[{"id":"initiator","label":"инициатор","scope":"формулирует вопрос, контекст и критерий полезности"},{"id":"contributor","label":"участник","scope":"добавляет основание, вариант, пример или ограничение"},{"id":"reviewer","label":"проверяющий","scope":"сопоставляет источники, последствия и смысловые потери"},{"id":"human_steward","label":"ответственный человек","scope":"отдельно принимает решение в своей подтверждённой области; локальная метка роли полномочий не создаёт"}],"workflow":[{"id":"question","title":"вопрос","body":"что важно понять, выразить или проверить?"},{"id":"context","title":"контекст","body":"что выбрано для общего рассмотрения и на каком основании?"},{"id":"proposal","title":"предложение","body":"какой доступный шаг предлагается и как заметить результат?"},{"id":"positions","title":"различение позиций","body":"что поддержано, оспорено, отложено или осталось без ответа?"},{"id":"review","title":"проверка","body":"сохранились ли основания, границы и право выбора?"},{"id":"decision","title":"черновик итога","body":"что остаётся HOLD и какое решение должен принять человек?"},{"id":"trace","title":"след и возвращение","body":"сохранить выбранное, проверить результат, исправить или завершить"}],"positions":[{"id":"support","label":"поддержка","meaning":"поддержка указанного предложения в названной области"},{"id":"objection","label":"возражение","meaning":"конкретное ограничение, риск или альтернативное объяснение"},{"id":"abstain","label":"воздержание","meaning":"позиция пока не принимается; причина может остаться неизвестной"},{"id":"no_response","label":"нет ответа","meaning":"ответ не получен; это не согласие и не воздержание"}],"claims":[{"id":"FACT","label":"факт"},{"id":"OBSERVATION","label":"наблюдение"},{"id":"INTERPRETATION","label":"интерпретация"},{"id":"HYPOTHESIS","label":"гипотеза"},{"id":"EVALUATION","label":"оценка"},{"id":"SYMBOL","label":"символ"},{"id":"UNKNOWN","label":"неизвестно"}],"modules":[{"id":"SUTI.angels","alias":".angels","title":"роли ангелов заботы","function":"добровольные роли помощи, передача задачи и понятные границы участия"},{"id":"SUTI.care","alias":".care","title":"забота как действие","function":"вопрос, посильный шаг, ресурс, ответственный человек и обратная связь"},{"id":"SUTI.verenium","alias":".verenium","title":"бережный интерфейс","function":"ясное предложение, обычный язык, пауза, исправление и выход"},{"id":"SUTI.veche","alias":".veche","title":"совместное рассмотрение","function":"предложения, различимые позиции, основания и ответственный итог"},{"id":"SUTI.os","alias":".os","title":"рабочее ядро","function":"контракты, роли, версии, границы данных и обратимость"},{"i r position, see the differences and save a portable discussion package","statusNote":"design specification and local prototype candidate; networked agents, messages, money, legal organisation and publication are off","preservation":"useful methods, versions and unresolved materials are preserved; originals are not destroyed, and selected transfers are reversible and have source → target, SHA and a receipt","privacy":"the common layer contains methods, roles and empty templates; personal stories, contacts, correspondence and sensitive information remain within the chosen private area","metaphor":"care angel is an optional interface metaphor; people and agents can use a plain role description without assigning identity or experiences","localState":"workshop records are held in the page's memory; save the JSON before closing. import adds checked records without replacing the original history","identityNote":"participant type and name in this local workshop are declared by the record's author; other participants' identities, authority and consent have not been verified here","ui":{"language":"language","guide":"method and structure","room":"discussion workshop","modules":"all areas","channel":"area","actor":"author's local name","actorKind":"participant type","role":"role","claim":"claim type","body":"contribution or explanation","source":"source or basis","proposal":"proposal ID","position":"position","add":"add a local record","export":"save discussion · JSON","import":"add records from JSON","records":"records","positions":"positions on the proposal","empty":"no records yet","noProposal":"general discussion","newProposal":"new proposal","decisionDraft":"draft outcome","contribution":"contribution","support":"support","objection":"objection","abstain":"abstention","noResponse":"no response received","human":"human","agent":"agent","tool":"tool","unknown":"unknown","pause":"pause","exit":"exit","draftOnly":"draft only; no decision or launch has taken place","saved":"local record added","imported":"records added after checking","error":"data could not be accepted","privateExport":"export is private; publication requires a separate selection","countsNote":"counters show local records, not verified human votes or a quorum","sourceDraft":"language draft; independent review and author acceptance are pending","yzhNote":"язэхъ is an authorial experiment; here it has an explicitly labelled meaning expansion and a separate, controlled candidate record","limits":"boundaries and states","titleField":"short title","type":"record type","createProposal":"create a proposal","recordPosition":"record a position","draftOutcome":"record a draft outcome","identityUnverified":"identity unverified","sourceOptional":"may be left UNKNOWN","noExternal":"network and external actions are off","fileChosen":"choose a previously saved discussion JSON"},"sections":[{"id":"preserve","title":"completeness and preservation","body":"first preserve the original and its context, then identify the distinction that can be carried over. similar files do not automatically become a single canon. unresolved material remains available with a clear label; working archives are kept outside the clean common assembly"},{"id":"crystal","title":"depersonalised common core","body":"each method describes its purpose, invariant, input, action, result, source, rights, version and boundaries. a personal name or story is not needed for the method to work. depersonalisation preserves a useful distinction without presenting a private case as a universal law"},{"id":"customise","title":"individual and collective configuration","body":"a personal profile, chosen language, pace and accessibility are connected separately. a collective defines its own roles, visibility and decision-making scope. settings can be edited and exported; another person's identity, consent or participation cannot be inferred from a template"},{"id":"agency","title":"care agency","body":"entry begins with a chosen question. identify a manageable action, the resource needed and the person making the decision. a bot does not allocate assistance, grants, payments or representation. a request can be clarified, passed to a suitable person or brought to a close"},{"id":"agent-care","title":"care in agent work","body":"an agent receives a clear task, permitted sources, a data boundary and an available budget. it records uncertainty, recurring failure, a pause and a handover. this is an operational arrangement of the process; feelings, suffering, consciousness or human needs are not attributed to the agent"},{"id":"dialogue","title":"a place for communication","body":"people and agents can prepare a contribution with explicit provenance. a message is material for consideration, not an execution command. hidden reasoning, secrets, raw private correspondence and unsolicited personal records are not included in the common package"},{"id":"veche","title":"the veche process","body":"each proposal receives a question, context and a way to check it. support, objection, abstention and no response are stored separately. silence is not consent. an AI perspective is not a human vote; the outcome has a responsible human and remains a draft until that person's separate decision"},{"id":"evidence","title":"checking the basis","body":"claim type, source, verification and decision are separate fields. PASS applies to an explicit criterion and environment. UNKNOWN is retained when data is insufficient; elegant wording does not increase certainty. COMMIT is not publication, and a specification is not a working service"},{"id":"boundaries","title":"participation boundaries","body":"the metaphor, play and participation are voluntary. plain language, correction, pause and exit are available. age-specific routes do not replace an official classification; youth intake is off pending separate conditions, and the first pilot is for consenting adults. emergency and clinical assistance are not claimed here"},{"id":"adapters","title":"connecting existing agents","body":"a proposed adapter transfers only the selected contribution, role, source, version and permission scope. import does not verify the author, rights or consent. network transport, secrets, permissions, an operator and a log require separate implementation and verification; they are currently off"},{"id":"languages","title":"languages and meaning transfer","body":"each edition is linked to the Russian source and its SHA. names, IDs, enums and code are preserved. negations, uncertainty, choice and consequences are checked. язэхъ receives a separate experimental status; its unknown meanings are not filled in by guesswork"},{"id":"next-step","title":"an accessible result","body":"choose an area and a question; add a contribution, proposal or position; check the source; save the JSON; if needed, import selected records into another local workshop. your own export does not automatically become shared or public"}],"roles":[{"id":"initiator","label":"initiator","scope":"formulates the question, context and criterion of usefulness"},{"id":"contributor","label":"contributor","scope":"adds a basis, option, example or limitation"},{"id":"reviewer","label":"reviewer","scope":"compares sources, consequences and losses of meaning"},{"id":"human_steward","label":"responsible human","scope":"makes a separate decision within their verified scope; a local role label does not confer authority"}],"workflow":[{"id":"question","title":"question","body":"what is important to understand, express or check?"},{"id":"context","title":"context","body":"what has been selected for joint consideration, and on what basis?"},{"id":"proposal","title":"proposal","body":"what manageable step is proposed, and how can its result be observed?"},{"id":"positions","title":"distinguishing positions","body":"what has been supported, challenged, deferred or left unanswered?"},{"id":"review","title":"review","body":"have the basis, boundaries and right to choose been preserved?"},{"id":"decision","title":"draft outcome","body":"what remains on HOLD, and what decision must a person make?"},{"id":"trace","title":"trace and return","body":"save what was selected, check the result, correct it or finish"}],"positions":[{"id":"support","label":"support","meaning":"support for the stated proposal within the named scope"},{"id":"objection","label":"objection","meaning":"a specific limitation, risk or alternative explanation"},{"id":"abstain","label":"abstention","meaning":"no position is being taken for now; the reason may remain unknown"},{"id":"no_response","label":"no response","meaning":"no response has been received; this is neither consent nor abstention"}],"claims":[{"id":"FACT","label":"fact"},{"id":"OBSERVATION","label":"observation"},{"id":"INTERPRETATION","label":"interpretation"},{"id":"HYPOTHESIS","label":"hypothesis"},{"id":"EVALUATION","label":"evaluation"},{"id":"SYMBOL","label":"symbol"},{"id":"UNKNOWN","label":"unknown"}],"modules":[{"id":"SUTI.angels","alias":".angels","title":"care angel roles","function":"voluntary helping roles, task handover and clear participation boundaries"},{"id":"SUTI.care","alias":".care","title":"care as action","function":"a question, a manageable step, a resource, a responsible human and feedback"},{"id":"SUTI.verenium","alias":".verenium","title":"a considerate interface","function":"a clear proposal, plain language, pause, correction and exit"},{"id":"SUTI.veche","alias":".veche","title":"joint deliberation","function":"proposals, distinct positions, bases and an outcome with human responsibility"},{"id":"SUTI.os","alias":".os","title":"working core","function":"contracts, roles, versions, data boundaries and reversibility"},{"id":"SUTI.lab","alias":".lab","title":"laboratory","function":"synthetic examples, bounded experiments and reproducible checks"},{"id":"SUTI.uni","alias":".uni","title":"learning","function":"short practice, a personal example and a check of understanding"},{"id":"SUTI.world","alias":".world","title":"shared entry point","function":"accessible navigation through methods and routes chosen by the person"},{"id":"SUTI.clan","alias":".clan","title":"voluntary circle","function":"invitation, acceptance of a role, agreed conditions and exit"},{"id":"SUTI.audit","alias":".audit","title":"audit","function":"precise verification scope, evidence, errors and corrections"},{"id":"SUTI.crystal","alias":".crystal","title":"knowledge crystal","function":"a method understandable on its own, with a source, boundaries and version"},{"id":"SUTI.oracle","alias":".oracle","title":"alternative questions","function":"several perspectives with explicit hypothesis or symbol status"},{"id":"SUTI.sotkan","alias":".sotkan","title":"connections","function":"entities, relationships, dependencies and provenance without hidden merging"},{"id":"SUTI.game","alias":".game","title":"play and practice","function":"a voluntary quest with plain wording and an observable step"},{"id":"SUTI.logos","alias":".logos","title":"language and expression","function":"terms, voice, direct transcreations and a check for meaning loss"}]},{"schema":"suti.care-veche.locale.v1","version":"2026-11-13.v1","locale":"es-419","source_locale":"ru","direction":"ltr","source_sha256":"58b895e7af0ed3b057a2be1951af42023bc2b6f346432f569ade88577e9711fb","title":"espacio común de cuidado y veche","subtitle":"pregunta clara · voces distinguibles · paso posible · huella conservada","scope":"base común despersonalizada para sistemas individuales y colectivos; taller local de deliberación","purpose":"conectar conocimientos, una agencia de cuidado y la deliberación conjunta para que cada persona pueda configurar el sistema por su cuenta y verificar el siguiente paso","outcome":"leer el método, registrar un aporte o una posición, ver las diferencias y guardar un paquete de deliberación transferible","statusNote":"especificación de diseño y candidato a prototipo local; agentes en red, mensajes, dinero, organización jurídica y publicación están desactivados","preservation":"se conservan los métodos útiles, las versiones y los materiales pendientes; los originales no se destruyen, las transferencias seleccionadas son reversibles y cuentan con source → target, SHA y un comprobante","privacy":"la capa común contiene métodos, roles y plantillas vacías; las historias personales, los contactos, la correspondencia y la información sensible permanecen en el ámbito privado elegido","metaphor":"ángel de cuidado es una imagen opcional de la interfaz; las personas y los agentes pueden usar una descripción corriente del rol, sin asignar identidades ni vivencias","localState":"los registros del taller se guardan en la memoria de la página; guarda el JSON antes de cerrarla. la importación agrega registros revisados, sin reemplazar el historial original","identityNote":"el tipo de participante y el nombre en este taller local son declarados por quien redacta el registro; aquí no se verifican la identidad, las facultades ni el consentimiento de otras personas participantes","ui":{"language":"idioma","guide":"método y estructura","room":"taller de deliberación","modules":"todos los ámbitos","channel":"ámbito","actor":"nombre local de quien escribe","actorKind":"tipo de participante","role":"rol","claim":"tipo de afirmación","body":"aporte o explicación","source":"fuente o fundamento","proposal":"ID de propuesta","position":"posición","add":"agregar registro local","export":"guardar deliberación · JSON","import":"agregar registros desde JSON","records":"registros","positions":"posiciones sobre la propuesta","empty":"aún no hay registros","noProposal":"deliberación general","newProposal":"nueva propuesta","decisionDraft":"borrador de resultado","contribution":"aporte","support":"apoyo","objection":"objeción","abstain":"abstención","noResponse":"sin respuesta recibida","human":"persona","agent":"agente","tool":"herramienta","unknown":"desconocido","pause":"pausa","exit":"salir","draftOnly":"solo un borrador; no se ha tomado una decisión ni se ha puesto en marcha","saved":"registro local agregado","imported":"registros agregados tras la revisión","error":"no se pudieron aceptar los datos","privateExport":"la exportación es privada; publicar requiere una selección aparte","countsNote":"los contadores muestran registros locales, no votos humanos verificados ni un cuórum","sourceDraft":"borrador lingüístico; están pendientes la revisión independiente y la aceptación del autor","yzhNote":"язэхъ es un experimento de autor; aquí hay un desarrollo de significado señalado explícitamente y un registro candidato separado y controlado","limits":"límites y estados","titleField":"título breve","type":"tipo de registro","createProposal":"crear propuesta","recordPosition":"registrar posición","draftOutcome":"registrar borrador de resultado","identityUnverified":"identidad sin verificar","sourceOptional":"se puede dejar UNKNOWN","noExternal":"la red y las acciones externas están desactivadas","fileChosen":"elige un JSON de deliberación guardado anteriormente"},"sections":[{"id":"preserve","title":"integridad y conservación","body":"primero se conserva el original y su contexto; después se identifica la distinción transferible. los archivos similares no pasan a formar un único canon automáticamente. lo pendiente sigue disponible con una indicación clara; los archivos de trabajo se guardan fuera de la compilación común depurada"},{"id":"crystal","title":"núcleo común despersonalizado","body":"cada método describe su objetivo, invariante, entrada, acción, resultado, fuente, derechos, versión y límites. un nombre o una historia personal no son necesarios para que el método funcione. la despersonalización conserva una distinción útil sin presentar un caso particular como una ley universal"},{"id":"customise","title":"configuración individual y colectiva","body":"el perfil personal, el idioma elegido, el ritmo y la accesibilidad se incorporan por separado. cada colectivo define sus propios roles, visibilidad y ámbito de decisión. la configuración puede editarse y exportarse; la identidad, el consentimiento y la participación de otras personas no se deducen de una plantilla"},{"id":"agency","title":"agencia de cuidado","body":"la entrada comienza con una pregunta elegida. se identifican una acción posible, el recurso necesario y la persona que toma la decisión. un bot no asigna ayudas, subvenciones, pagos ni representación. la solicitud puede aclararse, derivarse a una persona adecuada o cerrarse"},{"id":"agent-care","title":"cuidado en el trabajo de los agentes","body":"el agente recibe una tarea clara, las fuentes permitidas, un límite de datos y un presupuesto disponible. registra la incertidumbre, las fallas recurrentes, las pausas y el traspaso del trabajo. esto organiza el proceso de manera operativa; no se atribuyen al agente sentimientos, sufrimiento, conciencia ni necesidades humanas"},{"id":"dialogue","title":"espacio de comunicación","body":"las personas y los agentes pueden preparar un aporte de procedencia explícita. un mensaje es información para considerar, no una orden de ejecución. el paquete común no incluye razonamientos ocultos, secretos, correspondencia privada sin procesar ni registros personales no solicitados"},{"id":"veche","title":"proceso del veche","body":"cada propuesta recibe una pregunta, un contexto y una forma de verificación. el apoyo, la objeción, la abstención y la ausencia de respuesta se guardan por separado. el silencio no se considera consentimiento. una perspectiva de IA no es un voto humano; el resultado tiene una persona responsable y sigue siendo un borrador hasta que esta tome una decisión por separado"},{"id":"evidence","title":"verificación de fundamentos","body":"el tipo de afirmación, la fuente, la verificación y la decisión son campos distintos. PASS se refiere a un criterio y un entorno explícitos. UNKNOWN se mantiene cuando faltan datos; una expresión bella no aumenta la certeza. COMMIT no equivale a publicación, y una especificación no equivale a un servicio en funcionamiento"},{"id":"boundaries","title":"límites de participación","body":"la imagen, el juego y la participación son voluntarios. están disponibles el lenguaje corriente, la corrección, la pausa y la salida. las rutas por edad no sustituyen una clasificación oficial; la admisión de jóvenes está desactivada hasta que se establezcan condiciones específicas, y el primer piloto será con personas adultas que hayan dado su consentimiento. aquí no se ofrece asistencia de emergencia ni clínica"},{"id":"adapters","title":"conexión de agentes existentes","body":"el adaptador propuesto transfiere únicamente el aporte, el rol, la fuente, la versión y el ámbito de autorización seleccionados. importar no verifica la autoría, los derechos ni el consentimiento. el transporte en red, los secretos, los permisos, el operador y la bitácora requieren implementación y verificación aparte; por ahora están desactivados"},{"id":"languages","title":"idiomas y transferencia de significado","body":"cada edición se vincula con la fuente en ruso y su SHA. se conservan los nombres, los ID, los enums y el código. se revisan las negaciones, la incertidumbre, la elección y las consecuencias. язэхъ recibe un estado experimental propio; sus significados desconocidos no se completan con conjeturas"},{"id":"next-step","title":"resultado accesible","body":"elige un ámbito y una pregunta; agrega un aporte, una propuesta o una posición; verifica la fuente; guarda el JSON; si hace falta, importa los registros seleccionados en otro taller local. una exportación propia no se vuelve compartida ni pública automáticamente"}],"roles":[{"id":"initiator","label":"iniciador","scope":"formula la pregunta, el contexto y el criterio de utilidad"},{"id":"contributor","label":"participante","scope":"agrega un fundamento, una opción, un ejemplo o una limitación"},{"id":"reviewer","label":"revisor","scope":"compara las fuentes, las consecuencias y las pérdidas de significado"},{"id":"human_steward","label":"persona responsable","scope":"toma una decisión por separado dentro de su ámbito verificado; una etiqueta local de rol no otorga facultades"}],"workflow":[{"id":"question","title":"pregunta","body":"¿qué es importante comprender, expresar o verificar?"},{"id":"context","title":"contexto","body":"¿qué se eligió para la consideración conjunta y con qué fundamento?"},{"id":"proposal","title":"propuesta","body":"¿qué paso posible se propone y cómo se podrá observar el resultado?"},{"id":"positions","title":"distinción de posiciones","body":"¿qué se apoyó, se objetó, se aplazó o quedó sin respuesta?"},{"id":"review","title":"revisión","body":"¿se conservaron los fundamentos, los límites y el derecho a elegir?"},{"id":"decision","title":"borrador de resultado","body":"¿qué queda en HOLD y qué decisión debe tomar una persona?"},{"id":"trace","title":"huella y regreso","body":"guardar lo elegido, verificar el resultado, corregir o cerrar"}],"positions":[{"id":"support","label":"apoyo","meaning":"apoyo a la propuesta indicada dentro del ámbito señalado"},{"id":"objection","label":"objeción","meaning":"una limitación, un riesgo o una explicación alternativa concretos"},{"id":"abstain","label":"abstención","meaning":"por ahora no se adopta una posición; el motivo puede seguir siendo desconocido"},{"id":"no_response","label":"sin respuesta","meaning":"no se recibió una respuesta; no equivale a consentimiento ni a abstención"}],"claims":[{"id":"FACT","label":"hecho"},{"id":"OBSERVATION","label":"observación"},{"id":"INTERPRETATION","label":"interpretación"},{"id":"HYPOTHESIS","label":"hipótesis"},{"id":"EVALUATION","label":"evaluación"},{"id":"SYMBOL","label":"símbolo"},{"id":"UNKNOWN","label":"desconocido"}],"modules":[{"id":"SUTI.angels","alias":".angels","title":"roles de ángeles de cuidado","function":"roles voluntarios de ayuda, traspaso de tareas y límites claros de participación"} os âmbitos","channel":"âmbito","actor":"nome local de quem escreve","actorKind":"tipo de participante","role":"papel","claim":"tipo de afirmação","body":"contribuição ou explicação","source":"fonte ou fundamento","proposal":"ID da proposta","position":"posição","add":"adicionar registro local","export":"salvar discussão · JSON","import":"adicionar registros de JSON","records":"registros","positions":"posições sobre a proposta","empty":"ainda não há registros","noProposal":"discussão geral","newProposal":"nova proposta","decisionDraft":"rascunho do resultado","contribution":"contribuição","support":"apoio","objection":"objeção","abstain":"abstenção","noResponse":"nenhuma resposta recebida","human":"pessoa","agent":"agente","tool":"ferramenta","unknown":"desconhecido","pause":"pausa","exit":"sair","draftOnly":"apenas rascunho; não houve decisão nem ativação","saved":"registro local adicionado","imported":"registros adicionados após verificação","error":"não foi possível aceitar os dados","privateExport":"a exportação é privada; publicar exige uma seleção separada","countsNote":"os contadores mostram registros locais, não votos humanos verificados nem quórum","sourceDraft":"rascunho linguístico; revisão independente e aceitação pelo autor estão pendentes","yzhNote":"язэхъ é um experimento autoral; aqui há um desenvolvimento de significado explicitamente identificado e um registro candidato separado e controlado","limits":"limites e estados","titleField":"título curto","type":"tipo de registro","createProposal":"criar proposta","recordPosition":"registrar posição","draftOutcome":"registrar rascunho do resultado","identityUnverified":"identidade não verificada","sourceOptional":"pode ficar como UNKNOWN","noExternal":"a rede e as ações externas estão desativadas","fileChosen":"escolha um JSON de discussão salvo anteriormente"},"sections":[{"id":"preserve","title":"completude e preservação","body":"primeiro se preservam o original e seu contexto; depois se identifica a distinção transferível. arquivos semelhantes não se tornam um único cânone automaticamente. o que está pendente continua disponível com uma indicação clara; os acervos de trabalho ficam fora do conjunto comum depurado"},{"id":"crystal","title":"núcleo comum despersonalizado","body":"cada método descreve objetivo, invariante, entrada, ação, resultado, fonte, direitos, versão e limites. um nome ou uma história pessoal não são necessários para o método funcionar. a despersonalização preserva uma distinção útil sem apresentar um caso particular como lei universal"},{"id":"customise","title":"configuração individual e coletiva","body":"perfil pessoal, idioma escolhido, ritmo e acessibilidade são incorporados separadamente. o coletivo define seus próprios papéis, visibilidade e âmbito de decisão. as configurações podem ser editadas e exportadas; a identidade, o consentimento e a participação de outras pessoas não se deduzem de um modelo"},{"id":"agency","title":"agência de cuidado","body":"a entrada começa com uma pergunta escolhida. definir uma ação viável, o recurso necessário e a pessoa que toma a decisão. um bot não concede ajuda, subsídios, pagamentos nem representação. a solicitação pode ser esclarecida, encaminhada a uma pessoa adequada ou encerrada"},{"id":"agent-care","title":"cuidado no trabalho dos agentes","body":"o agente recebe uma tarefa clara, fontes permitidas, um limite de dados e um orçamento disponível. registra a incerteza, falhas recorrentes, pausas e a passagem do trabalho. isso organiza o processo de forma operacional; não se atribuem ao agente sentimentos, sofrimento, consciência ou necessidades humanas"},{"id":"dialogue","title":"lugar de comunicação","body":"pessoas e agentes podem preparar uma contribuição com procedência explícita. uma mensagem é informação para apreciação, não uma ordem de execução. raciocínios ocultos, segredos, correspondências privadas sem tratamento e registros pessoais não solicitados não entram no pacote comum"},{"id":"veche","title":"processo do veche","body":"cada proposta recebe uma pergunta, um contexto e uma forma de verificação. apoio, objeção, abstenção e ausência de resposta são guardados separadamente. o silêncio não é considerado consentimento. uma perspectiva de IA não é um voto humano; o resultado tem uma pessoa responsável e permanece como rascunho até uma decisão separada dessa pessoa"},{"id":"evidence","title":"verificação dos fundamentos","body":"tipo de afirmação, fonte, verificação e decisão são campos distintos. PASS se refere a um critério e a um ambiente explícitos. UNKNOWN é mantido quando faltam dados; uma formulação bonita não aumenta a certeza. COMMIT não equivale a publicação, e uma especificação não equivale a um serviço em funcionamento"},{"id":"boundaries","title":"limites de participação","body":"a imagem, o jogo e a participação são voluntários. linguagem comum, correção, pausa e saída estão disponíveis. os percursos por idade não substituem uma classificação oficial; o ingresso de jovens está desativado até que haja condições específicas, e o primeiro piloto é para adultos que tenham consentido. não se oferece aqui atendimento de emergência nem clínico"},{"id":"adapters","title":"conexão de agentes existentes","body":"o adaptador proposto transfere apenas a contribuição, o papel, a fonte, a versão e o âmbito de autorização escolhidos. importar não verifica autoria, direitos ou consentimento. transporte em rede, segredos, permissões, operador e registro de atividades exigem implementação e verificação separadas; por enquanto estão desativados"},{"id":"languages","title":"idiomas e transferência de significado","body":"cada edição se vincula à fonte em russo e ao seu SHA. nomes, IDs, enums e código são preservados. verificam-se negações, incerteza, escolha e consequências. язэхъ recebe um status experimental próprio; seus significados desconhecidos não são preenchidos por suposição"},{"id":"next-step","title":"resultado acessível","body":"escolha um âmbito e uma pergunta; adicione uma contribuição, proposta ou posição; verifique a fonte; salve o JSON; se necessário, importe os registros selecionados para outra oficina local. sua própria exportação não se torna compartilhada ou pública automaticamente"}],"roles":[{"id":"initiator","label":"iniciador","scope":"formula a pergunta, o contexto e o critério de utilidade"},{"id":"contributor","label":"participante","scope":"adiciona um fundamento, uma opção, um exemplo ou uma limitação"},{"id":"reviewer","label":"revisor","scope":"compara fontes, consequências e perdas de significado"},{"id":"human_steward","label":"pessoa responsável","scope":"toma uma decisão separada dentro de seu âmbito verificado; uma identificação local de papel não concede autoridade"}],"workflow":[{"id":"question","title":"pergunta","body":"o que é importante compreender, expressar ou verificar?"},{"id":"context","title":"contexto","body":"o que foi escolhido para apreciação conjunta e com qual fundamento?"},{"id":"proposal","title":"proposta","body":"qual passo viável se propõe e como observar o resultado?"},{"id":"positions","title":"distinção de posições","body":"o que recebeu apoio, foi contestado, adiado ou ficou sem resposta?"},{"id":"review","title":"revisão","body":"os fundamentos, os limites e o direito de escolher foram preservados?"},{"id":"decision","title":"rascunho do resultado","body":"o que permanece em HOLD e qual decisão uma pessoa deve tomar?"},{"id":"trace","title":"rastro e retorno","body":"salvar o que foi escolhido, verificar o resultado, corrigir ou encerrar"}],"positions":[{"id":"support","label":"apoio","meaning":"apoio à proposta indicada dentro do âmbito informado"},{"id":"objection","label":"objeção","meaning":"uma limitação, um risco ou uma explicação alternativa concretos"},{"id":"abstain","label":"abstenção","meaning":"por enquanto não se assume uma posição; o motivo pode permanecer desconhecido"},{"id":"no_response","label":"sem resposta","meaning":"nenhuma resposta foi recebida; isso não é consentimento nem abstenção"}],"claims":[{"id":"FACT","label":"fato"},{"id":"OBSERVATION","label":"observação"},{"id":"INTERPRETATION","label":"interpretação"},{"id":"HYPOTHESIS","label":"hipótese"},{"id":"EVALUATION","label":"avaliação"},{"id":"SYMBOL","label":"símbolo"},{"id":"UNKNOWN","label":"desconhecido"}],"modules":[{"id":"SUTI.angels","alias":".angels","title":"papéis de anjos do cuidado","function":"papéis voluntários de ajuda, passagem de tarefas e limites claros de participação"},{"id":"SUTI.care","alias":".care","title":"cuidado como ação","function":"pergunta, passo viável, recurso, pessoa responsável e retorno"},{"id":"SUTI.verenium","alias":".verenium","title":"interface cuidadosa","function":"proposta clara, linguagem comum, pausa, correção e saída"},{"id":"SUTI.veche","alias":".veche","title":"apreciação conjunta","function":"propostas, posições distinguíveis, fundamentos e resultado com responsabilidade humana"},{"id":"SUTI.os","alias":".os","title":"núcleo de trabalho","function":"contratos, papéis, versões, limites de dados e reversibilidade"},{"id":"SUTI.lab","alias":".lab","title":"laboratório","function":"exemplos sintéticos, experimentos delimitados e verificações reproduzíveis"},{"id":"SUTI.uni","alias":".uni","title":"aprendizagem","function":"prática breve, exemplo próprio e verificação da compreensão"},{"id":"SUTI.world","alias":".world","title":"entrada comum","function":"navegação acessível pelos métodos e percursos escolhidos pela pessoa"},{"id":"SUTI.clan","alias":".clan","title":"círculo voluntário","function":"convite, aceitação do papel, condições compartilhadas e saída"},{"id":"SUTI.audit","alias":".audit","title":"auditoria","function":"âmbito preciso de verificação, evidências, erros e correções"},{"id":"SUTI.crystal","alias":".crystal","title":"cristal do conhecimento","function":"método compreensível por si só, com fonte, limites e versão"},{"id":"SUTI.oracle","alias":".oracle","title":"perguntas alternativas","function":"várias perspectivas com status explícito de hipótese ou símbolo"},{"id":"SUTI.sotkan","alias":".sotkan","title":"conexões","function":"entidades, relações, dependências e procedência sem fusões ocultas"},{"id":"SUTI.game","alias":".game","title":"jogo e prática","function":"jornada lúdica voluntária com formulação comum e um passo observável"},{"id":"SUTI.logos","alias":".logos","title":"linguagem e expressão","function":"termos, voz, transcriações diretas e verificação de perdas de significado"}]},{"schema":"suti.care-veche.locale.v1","version":"2026-11-13.v1","locale":"zh-Hans","source_locale":"ru","direction":"ltr","source_sha256":"58b895e7af0ed3b057a2be1951af42023bc2b6f346432f569ade88577e9711fb","title":"关怀与共同议事空间","subtitle":"清晰的问题 · 可区分的声音 · 力所能及的一步 · 留存的记录","scope":"供个人和集体系统使用的去个人化共同基础；本地讨论工作坊","purpose":"将知识、拟议的关怀机构与共同审议连接起来，让人能够自行配置系统，并检验下一步","outcome":"阅读方法，记录贡献或立场，看清差异，并保存可迁移的讨论包","statusNote":"设计规范与本地原型候选；联网智能体、消息发送、资金操作、法律组织和公开发布均已关闭","preservation":"保留有用的方法、版本和未解决材料；不销毁原件，选定的迁移可撤回，并附有 source → target、SHA 和凭据","privacy":"共同层只含方法、角色和空白模板；个人经历、联系方式、通信和敏感信息留在所选的私密域","metaphor":"关怀天使是一种自愿采用的界面意象；人和智能体都可使用普通的角色表述，不据此赋予身份或内在体验","localState":"工作坊记录保存在页面内存中；关闭前请保存 JSON。导入会添加通过检查的记录，不会替换原有历史","identityNote":"本地工作坊中的参与者类型和姓名由记录作者自行声明；此处未核实其他参与者的身份、权限或同意","ui":{"language":"语言","guide":"方法与结构","room":"讨论工作坊","modules":"所有工作域","channel":"工作域","actor":"作者的本地名称","actorKind":"参与者类型","role":"角色","claim":"陈述类型","body":"贡献或说明","source":"来源或依据","proposal":"提案 ID","position":"立场","add":"添加本地记录","export":"保存讨论 · JSON","import":"从 JSON 添加记录","records":"记录","positions":"对提案的立场","empty":"暂无记录","noProposal":"一般讨论","newProposal":"新提案","decisionDraft":"结果草稿","contribution":"贡献","support":"支持","objection":"异议","abstain":"弃权","noResponse":"未收到回应","human":"人","agent":"智能体","tool":"工具","unknown":"未知","pause":"暂停","exit":"退出","draftOnly":"仅为草稿；尚未作出决定或启动执行","saved":"已添加本地记录","imported":"检查后已添加记录","error":"无法接收数据","privateExport":"导出内容属于私密资料；公开发布需要另行筛选","countsNote":"计数器显示的是本地记录，并非经核实的人类票数或法定人数","sourceDraft":"语言草稿；尚待独立校读及作者确认","yzhNote":"язэхъ 是作者的语言实验；此处提供明确标记的语义展开，以及一条独立、可控的候选记录","limits":"边界与状态","titleField":"简短标题","type":"记录类型","createProposal":"创建提案","recordPosition":"记录立场","draftOutcome":"记录结果草稿","identityUnverified":"身份未经核实","sourceOptional":"可保留为 UNKNOWN","noExternal":"网络与外部操作已关闭","fileChosen":"请选择先前保存的讨论 JSON"},"sections":[{"id":"preserve","title":"完整性与保留","body":"先保存原件及其语境，再提取可迁移的区别。相似文件不会自动合并为唯一正典。未解决材料保留可访问状态并有清晰标记；工作档案存放在整理后的共同构建之外"},{"id":"crystal","title":"去个人化的共同核心","body":"每种方法说明目标、不变量、输入、行动、结果、来源、权利、版本和边界。方法的使用不需要个人姓名或经历。去个人化保留有用的区别，但不把个别情形说成普遍规律"},{"id":"customise","title":"个人与集体配置","body":"个人档案、所选语言、节奏和无障碍设置分别接入。集体自行规定角色、可见范围和决策范围。设置可编辑、可导出；不能从模板推断他人的身份、同意或参与"},{"id":"agency","title":"关怀机构（方案）","body":"从所选问题开始。确定力所能及的行动、所需资源和决策人。援助、资助、付款及代表权不由机器人指定。请求可以澄清、转交合适的人，或结束"},{"id":"agent-care","title":"智能体工作中的关怀","body":"为智能体提供明确任务、获准使用的来源、数据边界和可用预算。记录不确定性、重复故障、暂停和工作交接。这是流程的运行组织；不赋予智能体感情、痛苦、意识或人的需求"},{"id":"dialogue","title":"交流场所","body":"人和智能体可以准备来源明确的贡献。消息是供审议的数据，并非执行命令。共同讨论包不包含隐藏推理、秘密、未经整理的私人通信或未经请求的个人记录"},{"id":"veche","title":"共同议事流程","body":"每项提案均有问题、语境和检查方式。支持、异议、弃权及未回应分别保存。沉默不视为同意。AI 的视角不是人的投票；结果须有负责的人，在其另行决定前仍为草稿"},{"id":"evidence","title":"依据检查","body":"陈述类型、来源、检查和决定是不同字段。PASS 针对明确的标准和环境。数据不足时保留 UNKNOWN；优美的表达不会提高确定性。COMMIT 不等于公开发布，规范不等于运行中的服务"},{"id":"boundaries","title":"参与边界","body":"意象、游戏和参与均出于自愿。可使用普通语言，也可更正、暂停和退出。年龄路径不能替代正式分级；在另行明确条件前，青少年接入关闭，首次试点面向已同意的成年人。此处不声称提供急救或临床援助"},{"id":"adapters","title":"接入运行中的智能体","body":"设计中的适配器仅传递所选贡献、角色、来源、版本和许可范围。导入不能核实作者、权利或同意。网络传输、秘密、权限、操作人员和日志需要另行实施与检查；目前均已关闭"},{"id":"languages","title":"语言与语义迁移","body":"每种语言版本均关联俄语来源及其 SHA。名称、ID、enums 和代码保持不变。检查否定、不确定性、选择和后果。язэхъ 单独标记为实验；不以猜测补全未知含义"},{"id":"next-step","title":"可取得的结果","body":"选择工作域和问题；添加贡献、提案或立场；检查来源；保存 JSON；如有需要，将所选记录导入另一个本地工作坊。自己的导出内容不会自动成为共同或公开资料"}],"roles":[{"id":"initiator","label":"发起者","scope":"表述问题、语境和有用性的标准"},{"id":"contributor","label":"参与者","scope":"添加依据、选项、例子或限制"},{"id":"reviewer","label":"核查者","scope":"比对来源、后果和语义损失"},{"id":"human_steward","label":"负责的人","scope":"在已核实的权限范围内另行作出决定；本地角色标签不会产生权限"}],"workflow":[{"id":"question","title":"问题","body":"需要理解、表达或检验的重要内容是什么？"},{"id":"context","title":"语境","body":"选取了哪些内容供共同审议，依据是什么？"},{"id":"proposal","title":"提案","body":"建议采取哪一步力所能及的行动，如何观察结果？"},{"id":"positions","title":"区分立场","body":"哪些内容得到支持、受到质疑、被暂缓，或未获回应？"},{"id":"review","title":"检查","body":"依据、边界和选择权是否保留？"},{"id":"decision","title":"结果草稿","body":"哪些内容仍为 HOLD，需要由人作出什么决定？"},{"id":"trace","title":"记录与回访","body":"保存所选内容，检查结果，更正或结束"}],"positions":[{"id":"support","label":"支持","meaning":"在说明的范围内支持所指提案"},{"id":"objection","label":"异议","meaning":"具体的限制、风险或另一种解释"},{"id":"abstain","label":"弃权","meaning":"暂不采取立场；原因可以保持未知"},{"id":"no_response","label":"未回应","meaning":"未收到回应；这既不是同意，也不是弃权"}],"claims":[{"id":"FACT","label":"事实"},{"id":"OBSERVATION","label":"观察"},{"id":"INTERPRETATION","label":"解释"},{"id":"HYPOTHESIS","label":"假设"},{"id":"EVALUATION","label":"评价"},{"id":"SYMBOL","label":"符号"},{"id":"UNKNOWN","label":"未知"}],"modules":[{"id":"SUTI.angels","alias":".angels","title":"关怀天使角色","function":"自愿的帮助角色、任务交接和清晰的参与边界"},{"id":"SUTI.care","alias":".care","title":"作为行动的关怀","function":"问题、力所能及的一步、资源、负责的人和反馈"},{"id":"SUTI.verenium","alias":".verenium","title":"体贴的界面","function":"清晰的提议、普通语言、暂停、更正和退出"},{"id":"SUTI.veche","alias":".veche","title":"共同审议","function":"提案、可区分的立场、依据和有负责人承担的结果"},{"id":"SUTI.os","alias":".os","title":"工作核心","function":"约定、角色、版本、数据边界和可逆性"},{"id":"SUTI.lab","alias":".lab","title":"实验室","function":"合成示例、范围受限的实验和可复现的检查"},{"id":"SUTI.uni","alias":".uni","title":"学习","function":"简短练习、自己的例子和理解检查"},{"id":"SUTI.world","alias":".world","title":"共同入口","function":"便于访问的方法导航及由人选择的路径"},{"id":"SUTI.clan","alias":".clan","title":"自愿的圈子","function":"邀请、接受角色、共同约定和退出"},{"id":"SUTI.audit","alias":".audit","title":"审计","function":"明确的检查范围、证据、错误和更正"},{"id":"SUTI.crystal","alias":".crystal","title":"知识晶体","function":"可独立理解的方法，附有来源、边界和版本"},{"id":"SUTI.oracle","alias":".oracle"," ागार साफ़ साझा संकलन से बाहर रखे जाते हैं"},{"id":"crystal","title":"पहचानरहित साझा केंद्र","body":"हर विधि लक्ष्य, अपरिवर्तनीय तत्व, इनपुट, कार्रवाई, परिणाम, स्रोत, अधिकार, संस्करण और सीमाएँ बताती है। विधि के काम करने के लिए निजी नाम या कहानी आवश्यक नहीं। पहचान हटाने पर उपयोगी भेद बना रहता है, लेकिन किसी निजी मामले को सार्वभौमिक नियम नहीं बताया जाता"},{"id":"customise","title":"व्यक्तिगत और सामूहिक अनुकूलन","body":"निजी प्रोफ़ाइल, चुनी गई भाषा, गति और सुगम्यता अलग से जोड़ी जाती हैं। समूह अपनी भूमिकाएँ, दृश्यता और निर्णय का दायरा तय करता है। सेटिंग संपादित और निर्यात की जा सकती हैं; प्रारूप से दूसरों की पहचान, सहमति या भागीदारी नहीं निकाली जाती"},{"id":"agency","title":"प्रस्तावित देखभाल एजेंसी","body":"प्रवेश चुने गए प्रश्न से शुरू होता है। सामर्थ्य के भीतर कार्रवाई, आवश्यक संसाधन और निर्णय लेने वाला व्यक्ति तय करें। सहायता, अनुदान, भुगतान और प्रतिनिधित्व बॉट तय नहीं करता। अनुरोध स्पष्ट किया जा सकता है, उपयुक्त व्यक्ति को सौंपा जा सकता है या समाप्त किया जा सकता है"},{"id":"agent-care","title":"एजेंट के काम में देखभाल","body":"एजेंट को स्पष्ट कार्य, अनुमत स्रोत, डेटा की सीमा और उपलब्ध बजट मिलता है। अनिश्चितता, बार-बार की विफलता, विराम और काम सौंपना दर्ज किया जाता है। यह प्रक्रिया का संचालन है; एजेंट पर भावनाएँ, पीड़ा, चेतना या मानवीय आवश्यकताएँ आरोपित नहीं की जातीं"},{"id":"dialogue","title":"संवाद का स्थान","body":"व्यक्ति और एजेंट स्पष्ट उद्गम वाला योगदान तैयार कर सकते हैं। संदेश विचार के लिए डेटा है, निष्पादन का आदेश नहीं। छिपे तर्क, रहस्य, असंपादित निजी पत्राचार और बिना माँगे निजी अभिलेख साझा पैकेज में शामिल नहीं किए जाते"},{"id":"veche","title":"विचारसभा की प्रक्रिया","body":"हर प्रस्ताव के साथ प्रश्न, संदर्भ और जाँच का तरीका होता है। समर्थन, आपत्ति, विरत रहना और उत्तर का अभाव अलग रखे जाते हैं। मौन को सहमति नहीं माना जाता। AI का दृष्टिकोण मानव मत नहीं है; निष्कर्ष का एक उत्तरदायी व्यक्ति होता है और उसके अलग निर्णय तक वह मसौदा रहता है"},{"id":"evidence","title":"आधारों की जाँच","body":"कथन का प्रकार, स्रोत, जाँच और निर्णय अलग-अलग फ़ील्ड हैं। PASS स्पष्ट मानदंड और परिवेश से जुड़ा है। डेटा कम होने पर UNKNOWN रहता है; सुंदर अभिव्यक्ति से विश्वास का स्तर नहीं बढ़ता। COMMIT प्रकाशन के बराबर नहीं है और विनिर्देश चालू सेवा के बराबर नहीं है"},{"id":"boundaries","title":"भागीदारी की सीमाएँ","body":"रूपक, खेल और भागीदारी स्वैच्छिक हैं। सामान्य भाषा, सुधार, विराम और बाहर निकलना उपलब्ध हैं। आयु के अनुसार मार्ग आधिकारिक वर्गीकरण का स्थान नहीं लेते; अलग शर्तें तय होने तक युवाओं का प्रवेश बंद है, पहला पायलट सहमति देने वाले वयस्कों के लिए है। यहाँ आपातकालीन या चिकित्सकीय सहायता देने का दावा नहीं है"},{"id":"adapters","title":"सक्रिय एजेंटों को जोड़ना","body":"प्रस्तावित अडैप्टर केवल चुना गया योगदान, भूमिका, स्रोत, संस्करण और अनुमति का दायरा भेजता है। आयात लेखक, अधिकार या सहमति की पुष्टि नहीं करता। नेटवर्क परिवहन, रहस्य, अनुमतियाँ, संचालक और लॉग के लिए अलग कार्यान्वयन और जाँच आवश्यक हैं; अभी वे बंद हैं"},{"id":"languages","title":"भाषाएँ और अर्थ का स्थानांतरण","body":"हर संस्करण रूसी स्रोत और उसके SHA से जुड़ा है। नाम, ID, enums और कोड सुरक्षित रहते हैं। निषेध, अनिश्चितता, चयन और परिणाम जाँचे जाते हैं। язэхъ को अलग प्रयोगात्मक स्थिति दी जाती है; उसके अज्ञात अर्थ अनुमान से नहीं भरे जाते"},{"id":"next-step","title":"उपलब्ध परिणाम","body":"कार्यदायरा और प्रश्न चुनें; योगदान, प्रस्ताव या पक्ष जोड़ें; स्रोत जाँचें; JSON सहेजें; आवश्यकता हो तो चुने गए अभिलेख दूसरी स्थानीय कार्यशाला में आयात करें। अपना निर्यात अपने आप साझा या सार्वजनिक नहीं बनता"}],"roles":[{"id":"initiator","label":"आरंभकर्ता","scope":"प्रश्न, संदर्भ और उपयोगिता का मानदंड तय करता है"},{"id":"contributor","label":"सहभागी","scope":"आधार, विकल्प, उदाहरण या सीमा जोड़ता है"},{"id":"reviewer","label":"जाँचकर्ता","scope":"स्रोतों, परिणामों और अर्थ की हानि की तुलना करता है"},{"id":"human_steward","label":"उत्तरदायी व्यक्ति","scope":"अपने सत्यापित दायरे में अलग निर्णय लेता है; स्थानीय भूमिका का नाम अधिकार पैदा नहीं करता"}],"workflow":[{"id":"question","title":"प्रश्न","body":"क्या समझना, व्यक्त करना या जाँचना महत्वपूर्ण है?"},{"id":"context","title":"संदर्भ","body":"साझा विचार के लिए क्या चुना गया है और किस आधार पर?"},{"id":"proposal","title":"प्रस्ताव","body":"सामर्थ्य के भीतर कौन-सा कदम सुझाया गया है और परिणाम कैसे दिखेगा?"},{"id":"positions","title":"पक्षों का भेद","body":"किसका समर्थन हुआ, किस पर आपत्ति हुई, क्या स्थगित है या अनुत्तरित रहा?"},{"id":"review","title":"जाँच","body":"क्या आधार, सीमाएँ और चुनने का अधिकार सुरक्षित हैं?"},{"id":"decision","title":"निष्कर्ष का मसौदा","body":"क्या HOLD पर है और व्यक्ति को कौन-सा निर्णय लेना है?"},{"id":"trace","title":"अभिलेख और वापसी","body":"चुना हुआ सहेजें, परिणाम जाँचें, सुधारें या समाप्त करें"}],"positions":[{"id":"support","label":"समर्थन","meaning":"बताए गए दायरे में निर्दिष्ट प्रस्ताव का समर्थन"},{"id":"objection","label":"आपत्ति","meaning":"कोई ठोस सीमा, जोखिम या वैकल्पिक व्याख्या"},{"id":"abstain","label":"विरत रहना","meaning":"अभी कोई पक्ष नहीं लिया जा रहा; कारण अज्ञात रह सकता है"},{"id":"no_response","label":"कोई उत्तर नहीं","meaning":"उत्तर नहीं मिला; यह न सहमति है, न विरत रहना"}],"claims":[{"id":"FACT","label":"तथ्य"},{"id":"OBSERVATION","label":"अवलोकन"},{"id":"INTERPRETATION","label":"व्याख्या"},{"id":"HYPOTHESIS","label":"परिकल्पना"},{"id":"EVALUATION","label":"मूल्यांकन"},{"id":"SYMBOL","label":"प्रतीक"},{"id":"UNKNOWN","label":"अज्ञात"}],"modules":[{"id":"SUTI.angels","alias":".angels","title":"देखभाल के देवदूतों की भूमिकाएँ","function":"मदद की स्वैच्छिक भूमिकाएँ, कार्य सौंपना और भागीदारी की स्पष्ट सीमाएँ"},{"id":"SUTI.care","alias":".care","title":"कार्रवाई के रूप में देखभाल","function":"प्रश्न, सामर्थ्य के भीतर कदम, संसाधन, उत्तरदायी व्यक्ति और प्रतिक्रिया"},{"id":"SUTI.verenium","alias":".verenium","title":"संवेदनशील इंटरफ़ेस","function":"स्पष्ट प्रस्ताव, सामान्य भाषा, विराम, सुधार और बाहर निकलना"},{"id":"SUTI.veche","alias":".veche","title":"साझा विचार","function":"प्रस्ताव, अलग पहचाने जाने वाले पक्ष, आधार और उत्तरदायित्व वाला निष्कर्ष"},{"id":"SUTI.os","alias":".os","title":"कार्यकारी केंद्र","function":"अनुबंध, भूमिकाएँ, संस्करण, डेटा की सीमाएँ और पूर्वस्थिति में लौटने की क्षमता"},{"id":"SUTI.lab","alias":".lab","title":"प्रयोगशाला","function":"कृत्रिम उदाहरण, सीमित प्रयोग और दोहराई जा सकने वाली जाँचें"},{"id":"SUTI.uni","alias":".uni","title":"सीखना","function":"छोटा अभ्यास, अपना उदाहरण और समझ की जाँच"},{"id":"SUTI.world","alias":".world","title":"साझा प्रवेश","function":"विधियों और व्यक्ति द्वारा चुने गए मार्गों में सुगम नेविगेशन"},{"id":"SUTI.clan","alias":".clan","title":"स्वैच्छिक मंडल","function":"आमंत्रण, भूमिका स्वीकारना, साझा शर्तें और बाहर निकलना"},{"id":"SUTI.audit","alias":".audit","title":"लेखा-परीक्षा","function":"जाँच का सटीक दायरा, साक्ष्य, त्रुटियाँ और सुधार"},{"id":"SUTI.crystal","alias":".crystal","title":"ज्ञान का क्रिस्टल","function":"स्रोत, सीमाओं और संस्करण के साथ स्वतंत्र रूप से समझी जा सकने वाली विधि"},{"id":"SUTI.oracle","alias":".oracle","title":"वैकल्पिक प्रश्न","function":"कई दृष्टिकोण, जिनकी परिकल्पना या प्रतीक की स्थिति स्पष्ट है"},{"id":"SUTI.sotkan","alias":".sotkan","title":"संबंध","function":"इकाइयाँ, संबंध, निर्भरताएँ और उद्गम; छिपा हुआ विलय नहीं"},{"id":"SUTI.game","alias":".game","title":"खेल और अभ्यास","function":"सामान्य शब्दों और देखे जा सकने वाले कदम वाला स्वैच्छिक अभियान"},{"id":"SUTI.logos","alias":".logos","title":"भाषा और अभिव्यक्ति","function":"शब्दावली, स्वर, सीधे अर्थानुकूल रूपांतरण और अर्थ की हानि की जाँच"}]},{"schema":"suti.care-veche.locale.v1","version":"2026-11-13.v1","locale":"fr","source_locale":"ru","direction":"ltr","source_sha256":"58b895e7af0ed3b057a2be1951af42023bc2b6f346432f569ade88577e9711fb","title":"espace commun de soin et de veche","subtitle":"question claire · voix distinctes · pas à portée · trace préservée","scope":"base commune dépersonnalisée pour les systèmes individuels et collectifs ; atelier local de discussion","purpose":"relier les connaissances, une agence de soin et l'examen collectif pour que la personne puisse configurer le système de manière autonome et vérifier le prochain pas","outcome":"lire la méthode, consigner une contribution ou une position, voir les différences et sauvegarder un dossier de discussion transférable","statusNote":"spécification de conception et candidat au statut de prototype local ; agents en réseau, messages, argent, organisation juridique et publication sont désactivés","preservation":"les méthodes utiles, les versions et les matériaux non résolus sont préservés ; les originaux ne sont pas détruits, les transferts sélectionnés sont réversibles et disposent de source → target, d'un SHA et d'un reçu","privacy":"la couche commune contient les méthodes, les rôles et les modèles vides ; les récits personnels, les contacts, les correspondances et les informations sensibles restent dans le cadre privé choisi","metaphor":"l'ange du soin est une image facultative de l'interface ; les personnes et les agents peuvent utiliser une description ordinaire du rôle, sans attribution d'identité ni de vécu","localState":"les entrées de l'atelier sont conservées dans la mémoire de la page ; sauvegardez le JSON avant de fermer. l'importation ajoute des entrées vérifiées sans remplacer l'historique d'origine","identityNote":"le type de participant et le nom dans cet atelier local sont déclarés par l'auteur de l'entrée ; l'identité, les pouvoirs et le consentement des autres participants ne sont pas vérifiés ici","ui":{"language":"langue","guide":"méthode et structure","room":"atelier de discussion","modules":"tous les cadres","channel":"cadre","actor":"nom local de l'auteur","actorKind":"type de participant","role":"rôle","claim":"type d'énoncé","body":"contribution ou explication","source":"source ou fondement","proposal":"ID de la proposition","position":"position","add":"ajouter une entrée locale","export":"sauvegarder la discussion · JSON","import":"ajouter des entrées depuis un JSON","records":"entrées","positions":"positions sur la proposition","empty":"aucune entrée pour le moment","noProposal":"discussion générale","newProposal":"nouvelle proposition","decisionDraft":"brouillon de conclusion","contribution":"contribution","support":"soutien","objection":"objection","abstain":"abstention","noResponse":"aucune réponse reçue","human":"personne","agent":"agent","tool":"outil","unknown":"inconnu","pause":"pause","exit":"quitter","draftOnly":"brouillon uniquement ; aucune décision ni mise en route n'a eu lieu","saved":"entrée locale ajoutée","imported":"entrées ajoutées après vérification","error":"les données n'ont pas pu être acceptées","privateExport":"l'export est privé ; la publication exige une sélection distincte","countsNote":"les compteurs indiquent des entrées locales, pas des votes humains vérifiés ni un quorum","sourceDraft":"brouillon linguistique ; relecture indépendante et acceptation par l'auteur en attente","yzhNote":"язэхъ est une expérimentation d'auteur ; ici figurent un développement du sens explicitement signalé et une entrée candidate distincte et contrôlée","limits":"limites et états","titleField":"titre court","type":"type d'entrée","createProposal":"créer une proposition","recordPosition":"consigner une position","draftOutcome":"consigner un brouillon de conclusion","identityUnverified":"identité non vérifiée","sourceOptional":"peut rester UNKNOWN","noExternal":"le réseau et les actions externes sont désactivés","fileChosen":"choisissez un JSON de discussion sauvegardé auparavant"},"sections":[{"id":"preserve","title":"complétude et préservation","body":"préserver d'abord l'original et son contexte, puis dégager la distinction transférable. des fichiers semblables ne deviennent pas automatiquement un canon unique. les éléments non résolus restent accessibles avec une indication claire ; les archives de travail sont conservées hors de l'ensemble commun épuré"},{"id":"crystal","title":"noyau commun dépersonnalisé","body":"chaque méthode décrit son objectif, son invariant, son entrée, son action, son résultat, sa source, ses droits, sa version et ses limites. un nom ou un récit personnel n'est pas nécessaire au fonctionnement de la méthode. la dépersonnalisation préserve une distinction utile sans présenter un cas particulier comme une loi universelle"},{"id":"customise","title":"configuration individuelle et collective","body":"le profil personnel, la langue choisie, le rythme et l'accessibilité sont intégrés séparément. le collectif définit ses propres rôles, sa visibilité et son périmètre de décision. les réglages sont modifiables et exportables ; l'identité, le consentement et la participation d'autrui ne se déduisent pas d'un modèle"},{"id":"agency","title":"agence de soin","body":"l'entrée commence par une question choisie. définir une action à portée, la ressource nécessaire et la personne qui décide. un bot n'attribue ni aides, ni subventions, ni paiements, ni représentation. la demande peut être précisée, transmise à une personne adaptée ou close"},{"id":"agent-care","title":"le soin dans le travail des agents","body":"l'agent reçoit une tâche claire, des sources autorisées, une limite concernant les données et un budget disponible. il consigne l'incertitude, les défaillances récurrentes, les pauses et la transmission du travail. il s'agit d'une organisation opérationnelle du processus ; aucun sentiment, aucune souffrance, aucune conscience ni aucun besoin humain n'est attribué à l'agent"},{"id":"dialogue","title":"lieu de communication","body":"les personnes et les agents peuvent préparer une contribution dont la provenance est explicite. un message constitue des données à examiner, pas un ordre d'exécution. les raisonnements cachés, les secrets, les correspondances privées brutes et les entrées personnelles non sollicitées ne sont pas inclus dans le dossier commun"},{"id":"veche","title":"déroulement du veche","body":"chaque proposition reçoit une question, un contexte et un moyen de vérification. soutien, objection, abstention et absence de réponse sont conservés séparément. le silence ne vaut pas consentement. une perspective d'IA n'est pas un vote humain ; la conclusion a une personne responsable et reste un brouillon jusqu'à sa décision distincte"},{"id":"evidence","title":"vérification des fondements","body":"le type d'énoncé, la source, la vérification et la décision sont des champs distincts. PASS se rapporte à un critère et à un environnement explicites. UNKNOWN est maintenu lorsque les données manquent ; la beauté d'une formulation n'augmente pas la certitude. COMMIT n'équivaut pas à une publication, et une spécification n'équivaut pas à un service en fonctionnement"},{"id":"boundaries","title":"limites de participation","body":"l'image, le jeu et la participation sont volontaires. langage ordinaire, correction, pause et sortie sont disponibles. les parcours par âge ne remplacent pas une classification officielle ; l'accueil de jeunes est désactivé dans l'attente de conditions distinctes, et le premier pilote concerne des adultes consentants. aucune aide d'urgence ni clinique n'est proposée ici"},{"id":"adapters","title":"connexion d'agents existants","body":"l'adaptateur envisagé transmet uniquement la contribution, le rôle, la source, la version et le périmètre d'autorisation sélectionnés. l'importation ne vérifie ni l'auteur, ni les droits, ni le consentement. le transport en réseau, les secrets, les autorisations, l'opérateur et le journal nécessitent une mise en œuvre et une vérification distinctes ; ils sont actuellement désactivés"},{"id":"languages","title":"langues et transfert du sens","body":"chaque édition est reliée à la source russe et à son SHA. les noms, ID, enums et le code sont conservés. négations, incertitude, choix et conséquences sont vérifiés. язэхъ reçoit un statut expérimental distinct ; ses significations inconnues ne sont pas complétées par des suppositions"},{"id":"next-step","title":"résultat accessible","body":"choisissez un cadre et une question ; ajoutez une contribution, une proposition ou une position ; vérifiez la source ; sauvegardez le JSON ; si nécessaire, importez les entrées sélectionnées dans un autre atelier local. votre propre export ne devient pas automatiquement partagé ou public"}],"roles":[{"id":"initiator","label":"initiateur","scope":"formule la question, le contexte et le critère d'utilité"},{"id":"contributor","label":"participant","scope":"ajoute un fondement, une option, un exemple ou une limite"},{"id":"reviewer","label":"relecteur","scope":"compare les sources, les conséquences et les pertes de sens"},{"id":"human_steward","label":"personne responsable","scope":"prend une décision distincte dans son périmètre vérifié ; une étiquette locale de rôle ne confère aucun pouvoir"}],"workflow":[{"id":"question","title":"question","body":"qu'est-il important de comprendre, d'exprimer ou de vérifier ?"},{"id":"context","title":"contexte","body":"qu'a-t-on choisi pour l'examen collectif et sur quel fondement ?"},{"id":"proposal","title":"proposition","body":"quel pas à portée est proposé et comment en observer le résultat ?"},{"id":"positions","title":"distinction des positions","body":"qu'a-t-on soutenu, contesté, reporté ou laissé sans réponse ?"},{"id":"review","title":"vérification","body":"les fondements, les limites et le droit de choisir ont-ils été préservés ?"},{"id":"decision","title":"brouillon de conclusion","body":"qu'est-ce qui reste en HOLD et quelle décision une personne doit-elle prendre ?"},{"id":"trace","title":"trace et retour","body":"sauvegarder ce qui a été choisi, vérifier le résultat, corriger ou clore"}],"positions":[{"id":"support","label":"soutien","meaning":"soutien à la proposition indiquée dans le périmètre nommé"},{"id":"objection","label":"objection","meaning":"une limite, un risque ou une explication alternative précis"},{"id":"abstain","label":"abstention","meaning":"aucune position n'est prise pour le moment ; la raison peut rester inconnue"},{"id":"no_response","label":"sans réponse","meaning":"aucune réponse n'a été reçue ; ce n'est ni un consentement ni une abstention"}],"claims":[{"id":"FACT","label":"fait"},{"id":"OBSERVATION","label":"observation"},{"id":"INTERPRETATION","label":"interprétation"},{"id":"HYPOTHESIS","label":"hypothèse"},{"id":"EVALUATION","label":"évaluation"},{"id":"SYMBOL","label":"symbole"},{"id":"UNKNOWN","label":"inconnu"}],"modules":[{"id":"SUTI.angels","alias":".angels","title":"rôles des anges du soin","function":"rôles volontaires d'aide, transmission de tâches et limites claires de participation"},{"id":"SUTI.care","alias":".care","title":"le soin comme action","function":"question, pas à portée, ressource, personne responsable et retour"},{"id":"SUTI.verenium","alias":".verenium","title":"interface attentionnée","function":"proposition claire, langage ordinaire, pause, correction et sortie"},{"id":"SUTI.veche","alias":".veche","title":"examen collectif","function":"propositions, positions distinctes, fondements et conclusion sous responsabilité humaine"},{"id":"SUTI.os","alias":".os","title":"noyau de travail","function":"contrats, rôles, versions, limites concernant les données et réversibilité"},{"id":"SUTI.lab","alias":".lab","title":"laboratoire","function":"exemples synthétiques, expérimentations délimitées et vérifications reproductibles"},{"id":"SUTI.uni","alias":".uni","title":"apprentissage","function":"pratique courte, exemple personnel et vérification de la compréhension"},{"id":"SUTI.world","alias":".world","title":"entrée commune","function":"navigation accessible parmi les méthodes et les parcours choisis par la personne"},{"id":"SUTI.clan","alias":".clan","title":"cercle volontaire","function":"invitation, acceptation d'un rôle, conditions communes et sortie"},{"id":"SUTI.audit","alias":".audit","title":"audit","function":"périmètre précis de vérification, preuves, erreurs et corrections"},{"id":"SUTI.crystal","alias":".crystal","title":"cristal de connaissance","function":"méthode compréhensible de manière autonome, avec source, limites et version"},{"id":"SUTI.oracle","alias":".oracle","title":"questions alternatives","function":"plusieurs perspectives avec un statut explicite d'hypothèse ou de symbole"},{"id":"SUTI.sotkan","alias":".sotkan","title":"liens","function":"entités, relations, dépendances et provenance sans fusion cachée"},{"id":"SUTI.game","alias":".game","title":"jeu et pratique","function":"quête volontaire avec une formulation ordinaire et un pas observable"},{"id":"SUTI.logos","alias":".logos","title":"langage et expression","function":"termes, voix, transcréations directes et vérification des pertes de sens"}]},{"schema":"suti.care-veche.locale.v1","version":"2026-11-13.v1","locale":"ar","source_locale":"ru","direction":"rtl","source_sha256":"58b895e7af0ed3b057a2be1951af42023bc2b6f346432f569ade88577e9711fb","title":"مساحة مشتركة للرعاية والتشاور","subtitle":"سؤال واضح · أصوات يمكن تمييزها · خطوة في حدود الاستطاعة · أثر محفوظ","scope":"أساس مشترك منزوع الهوية للأنظمة الفردية والجماعية؛ ورشة نقاش محلية","purpose":"ربط المعرفة ووكالة الرعاية المقترحة والنظر المشترك، بحيث يستطيع الشخص تهيئة النظام بنفسه والتحقق من الخطوة التالية","outcome":"قراءة المنهج، وتسجيل مساهمة أو موقف، ورؤية الفروق، وحفظ حزمة نقاش قابلة للنقل","statusNote":"مواصفة مشروع ونموذج أولي محلي مرشح؛ الوكلاء المتصلون بالشبكة وإرسال الرسائل والتعاملات المالية والتنظيم القانوني والنشر معطلة","preservation":"تُحفظ المناهج المفيدة والإصدارات والمواد غير المحسومة؛ لا تُتلف الأصول، وعمليات النقل المختارة قابلة للعكس ولها source → target وSHA وإيصال","privacy":"تحتوي الطبقة المشتركة على مناهج وأدوار وقوالب فارغة؛ تبقى القصص الشخصية وبيانات الاتصال والمراسلات والمعلومات الحساسة في النطاق الخاص المختار","metaphor":"ملاك الرعاية صورة اختيارية للواجهة؛ تتاح للأشخاص والوكلاء صياغة عادية للدور دون إسناد هوية أو تجارب داخلية إليهم","localState":"سجلات الورشة في ذاكرة الصفحة؛ احفظ JSON قبل الإغلاق. يضيف الاستيراد السجلات التي اجتازت الفحص، ولا يستبدل التاريخ الأصلي","identityNote":"نوع المشارك واسمه في هذه الورشة المحلية يصرح بهما كاتب السجل؛ لم تُتحقق هنا هويات المشاركين الآخرين أو صلاحياتهم أو موافقتهم","ui":{"language":"اللغة","guide":"المنهج والبنية","room":"ورشة النقاش","modules":"جميع نطاقات العمل","channel":"نطاق العمل","actor":"اسم الكاتب المحلي","actorKind":"نوع المشارك","role":"الدور","claim":"نوع الادعاء","body":"مساهمة أو توضيح","source":"مصدر أو أساس","proposal":"ID المقترح","position":"الموقف","add":"إضافة سجل محلي","export":"حفظ النقاش · JSON","import":"إضافة سجلات من JSON","records":"السجلات","positions":"المواقف من المقترح","empty":"لا توجد سجلات بعد","noProposal":"نقاش عام","newProposal":"مقترح جديد","decisionDraft":"مسودة الخلاصة","contribution":"مساهمة","support":"تأييد","objection":"اعتراض","abstain":"امتناع","noResponse":"لم يصل رد","human":"شخص","agent":"وكيل برمجي","tool":"أداة","unknown":"غير معروف","pause":"توقف مؤقت","exit":"خروج","draftOnly":"مسودة فقط؛ لم يُتخذ قرار ولم يبدأ التنفيذ","saved":"أُضيف السجل المحلي","imported":"أُضيفت السجلات بعد الفحص","error":"تعذر قبول البيانات","privateExport":"التصدير خاص؛ يتطلب النشر اختيارًا منفصلًا","countsNote":"تعرض العدادات سجلات محلية، ولا تمثل أصواتًا بشرية موثقة أو نصابًا","sourceDraft":"مسودة لغوية؛ بانتظار تدقيق مستقل وقبول الكاتب","yzhNote":"язэхъ تجربة من تأليف صاحبها؛ هنا شرح موسع للمعنى موسوم بوضوح وسجل مرشح منفصل قابل للتحكم","limits":"الحدود والحالات","titleField":"عنوان قصير","type":"نوع السجل","createProposal":"إنشاء مقترح","recordPosition":"تسجيل موقف","draftOutcome":"تسجيل مسودة الخلاصة","identityUnverified":"الهوية غير متحقق منها","sourceOptional":"يمكن إبقاء UNKNOWN","noExternal":"الشبكة والإجراءات الخارجية معطلة","fileChosen":"اختر ملف JSON لنقاش محفوظ سابقًا"},"sections":[{"id":"preserve","title":"الاكتمال والحفظ","body":"احفظ الأصل وسياقه أولًا، ثم استخلص التمييز القابل للنقل. لا تصبح الملفات المتشابهة مرجعًا معتمدًا واحدًا تلقائيًا. تبقى المواد غير المحسومة متاحة مع وسم واضح؛ وتُحفظ أرشيفات العمل خارج التجميع المشترك المنقح"},{"id":"crystal","title":"نواة مشتركة منزوعة الهوية","body":"يصف كل منهج الهدف والثابت والمدخل والإجراء والنتيجة والمصدر والحقوق والإصدار والحدود. لا يحتاج عمل المنهج إلى اسم شخصي أو قصة شخصية. يحفظ نزع الهوية التمييز المفيد، دون تقديم حالة خاصة بوصفها قانونًا عامًا"},{"id":"customise","title":"تهيئة فردية وجماعية","body":"يُضاف الملف الشخصي واللغة المختارة والإيقاع وإعدادات الإتاحة كل على حدة. تحدد المجموعة أدوارها ونطاق الرؤية واتخاذ القرارات. يمكن تحرير الإعدادات وتصديرها؛ ولا تُستنتج هوية الآخرين أو موافقتهم أو مشاركتهم من القالب"},{"id":"agency","title":"وكالة الرعاية المقترحة","body":"يبدأ الدخول بالسؤال المختار. حدد إجراءً في حدود الاستطاعة والمورد اللازم والشخص الذي يتخذ القرار. لا يقرر البوت المساعدة أو المنح أو المدفوعات أو التمثيل. يمكن توضيح الطلب أو إحالته إلى شخص مناسب أو إنهاؤه"},{"id":"agent-care","title":"الرعاية في عمل الوكلاء","body":"يتلقى الوكيل مهمة واضحة ومصادر مسموحًا بها وحدودًا للبيانات وميزانية متاحة. يسجل عدم اليقين والإخفاق المتكرر والتوقف المؤقت وتسليم العمل. هذا تنظيم تشغيلي للعملية؛ ولا تُنسب إلى الوكيل مشاعر أو معاناة أو وعي أو احتياجات بشرية"},{"id":"dialogue","title":"مكان للتواصل","body":"يمكن للأشخاص والوكلاء إعداد مساهمة واضحة المنشأ. الرسالة بيانات للنظر فيها، وليست أمرًا بالتنفيذ. لا تُدرج في الحزمة المشتركة الاستدلالات الخفية أو الأسرار أو المراسلات الخاصة الخام أو السجلات الشخصية غير المطلوبة"},{"id":"veche","title":"مسار مجلس التشاور","body":"يرتبط كل مقترح بسؤال وسياق وطريقة للتحقق. يُحفظ التأييد والاعتراض والامتناع وغياب الرد كل على حدة. لا يُعد الصمت موافقة. منظور AI ليس صوتًا بشريًا؛ وللخلاصة شخص مسؤول، وتبقى مسودة إلى أن يتخذ قراره المنفصل"},{"id":"evidence","title":"التحقق من الأسس","body":"نوع الادعاء والمصدر والتحقق والقرار حقول مختلفة. تتعلق PASS بمعيار وبيئة واضحين. تبقى UNKNOWN عند نقص البيانات؛ ولا ترفع الصياغة الجميلة درجة اليقين. لا تساوي COMMIT النشر، ولا تساوي المواصفة خدمة عاملة"},{"id":"boundaries","title":"حدود المشاركة","body":"الصورة المجازية واللعب والمشاركة اختيارية. تتاح اللغة العادية والتصحيح والتوقف المؤقت والخروج. لا تحل المسارات العمرية محل التصنيف الرسمي؛ استقبال الشباب معطل إلى حين وضع شروط منفصلة، والتجربة الأولى للبالغين الموافقين. لا يُدعى هنا تقديم مساعدة طارئة أو سريرية"},{"id":"adapters","title":"ربط الوكلاء العاملين","body":"ينقل المحول المقترح فقط المساهمة والدور والمصدر والإصدار ونطاق الإذن المختارة. لا يؤكد الاستيراد المؤلف أو الحقوق أو الموافقة. يتطلب النقل الشبكي والأسرار والأذونات والمشغل والسجل تنفيذًا وتحققًا منفصلين؛ وهي معطلة حاليًا"},{"id":"languages","title":"اللغات ونقل المعنى","body":"يرتبط كل إصدار بالمصدر الروسي وبصمة SHA الخاصة به. تُحفظ الأسماء وID وenums والشيفرة. تُفحص صيغ النفي وعدم اليقين والاختيار والعواقب. تُمنح язэхъ حالة تجريبية مستقلة؛ ولا تُملأ معانيها المجهولة بالتخمين"},{"id":"next-step","title":"نتيجة متاحة","body":"اختر نطاق العمل والسؤال؛ أضف مساهمة أو مقترحًا أو موقفًا؛ تحقق من المصدر؛ احفظ JSON؛ واستورد السجلات المختارة عند الحاجة إلى ورشة محلية أخرى. لا يصبح تصديرك مشتركًا أو عامًا تلقائيًا"}],"roles":[{"id":"initiator","label":"المبادر","scope":"يصوغ السؤال والسياق ومعيار الفائدة"},{"id":"contributor","label":"المشارك","scope":"يضيف أساسًا أو خيارًا أو مثالًا أو قيدًا"},{"id":"reviewer","label":"المراجع","scope":"يقارن المصادر والعواقب وما فُقد من المعنى"},{"id":"human_steward","label":"الشخص المسؤول","scope":"يتخذ قرارًا منفصلًا ضمن نطاق صلاحياته المتحقق منه؛ لا يمنح وسم الدور المحلي صلاحيات"}],"workflow":[{"id":"question","title":"السؤال","body":"ما المهم فهمه أو التعبير عنه أو التحقق منه؟"},{"id":"context","title":"السياق","body":"ما الذي اختير للنظر المشترك، وعلى أي أساس؟"},{"id":"proposal","title":"المقترح","body":"ما الخطوة المقترحة ضمن الاستطاعة، وكيف تُلاحظ النتيجة؟"},{"id":"positions","title":"تمييز المواقف","body":"ما الذي أُيد أو اعتُرض عليه أو أُجل أو بقي دون رد؟"},{"id":"review","title":"التحقق","body":"هل حُفظت الأسس والحدود وحرية الاختيار؟"},{"id":"decision","title":"مسودة الخلاصة","body":"ما الذي يبقى في حالة HOLD، وما القرار الذي يجب أن يتخذه الشخص؟"},{"id":"trace","title":"الأثر والعودة","body":"احفظ المختار، وتحقق من النتيجة، وصحح أو أنهِ"}],"positions":[{"id":"support","label":"تأييد","meaning":"تأييد المقترح المحدد ضمن النطاق المذكور"},{"id":"objection","label":"اعتراض","meaning" াদান, ইনপুট, কাজ, ফল, উৎস, অধিকার, সংস্করণ ও সীমা জানায়। পদ্ধতি চালাতে ব্যক্তিগত নাম বা কাহিনি লাগে না। পরিচয় সরিয়েও উপযোগী পার্থক্য থাকে, কিন্তু বিশেষ ঘটনাকে সর্বজনীন নিয়ম বলা হয় না"},{"id":"customise","title":"ব্যক্তিগত ও সমষ্টিগত বিন্যাস","body":"ব্যক্তিগত প্রোফাইল, বেছে নেওয়া ভাষা, গতি ও অভিগম্যতা আলাদাভাবে যুক্ত হয়। সমষ্টি নিজের ভূমিকা, দৃশ্যমানতার পরিসর ও সিদ্ধান্তের ক্ষেত্র ঠিক করে। বিন্যাস সম্পাদনা ও রপ্তানি করা যায়; ছক থেকে অন্যের পরিচয়, সম্মতি বা অংশগ্রহণ অনুমান করা হয় না"},{"id":"agency","title":"প্রস্তাবিত যত্ন সংস্থা","body":"প্রবেশ শুরু হয় নির্বাচিত প্রশ্ন দিয়ে। সামর্থ্যের মধ্যে কাজ, প্রয়োজনীয় সম্পদ এবং সিদ্ধান্ত নেবেন যিনি, তাঁকে নির্ধারণ করুন। সহায়তা, অনুদান, অর্থপ্রদান বা প্রতিনিধিত্ব বট নির্ধারণ করে না। অনুরোধ স্পষ্ট করা, উপযুক্ত মানুষের কাছে দেওয়া বা শেষ করা যায়"},{"id":"agent-care","title":"এজেন্টের কাজে যত্ন","body":"এজেন্ট স্পষ্ট কাজ, অনুমোদিত উৎস, তথ্যের সীমা ও উপলব্ধ বাজেট পায়। অনিশ্চয়তা, বারবার ব্যর্থতা, বিরতি ও কাজ হস্তান্তর নথিবদ্ধ করে। এটি প্রক্রিয়ার কার্যগত সংগঠন; এজেন্টের ওপর অনুভূতি, কষ্ট, চেতনা বা মানুষের প্রয়োজন আরোপ করা হয় না"},{"id":"dialogue","title":"যোগাযোগের স্থান","body":"মানুষ ও এজেন্ট স্পষ্ট উৎসসহ অবদান প্রস্তুত করতে পারেন। বার্তা বিবেচনার তথ্য, চালানোর আদেশ নয়। গোপন যুক্তিচিন্তা, গোপনীয় তথ্য, অপরিশোধিত ব্যক্তিগত চিঠিপত্র ও না চাওয়া ব্যক্তিগত নথি সাধারণ প্যাকেজে যোগ করা হয় না"},{"id":"veche","title":"যৌথ আলোচনার ধারা","body":"প্রতিটি প্রস্তাবের সঙ্গে প্রশ্ন, প্রসঙ্গ ও যাচাইয়ের উপায় থাকে। সমর্থন, আপত্তি, বিরত থাকা ও উত্তর না পাওয়া আলাদা রাখা হয়। নীরবতা সম্মতি নয়। AI-এর দৃষ্টিকোণ মানুষের ভোট নয়; ফলাফলের জন্য দায়িত্বশীল মানুষ থাকেন এবং তাঁর আলাদা সিদ্ধান্ত পর্যন্ত তা খসড়া থাকে"},{"id":"evidence","title":"ভিত্তি যাচাই","body":"বক্তব্যের ধরন, উৎস, যাচাই ও সিদ্ধান্ত আলাদা ক্ষেত্র। PASS স্পষ্ট মানদণ্ড ও পরিবেশের জন্য প্রযোজ্য। তথ্য কম হলে UNKNOWN থাকে; সুন্দর প্রকাশে নিশ্চয়তা বাড়ে না। COMMIT প্রকাশনার সমান নয়, আর নির্দিষ্টকরণ চালু পরিষেবার সমান নয়"},{"id":"boundaries","title":"অংশগ্রহণের সীমা","body":"রূপক, খেলা ও অংশগ্রহণ ঐচ্ছিক। সাধারণ ভাষা, সংশোধন, বিরতি ও প্রস্থান আছে। বয়সভিত্তিক পথ আনুষ্ঠানিক শ্রেণিবিন্যাসের বিকল্প নয়; আলাদা শর্ত নির্ধারণের আগে তরুণদের গ্রহণ বন্ধ, প্রথম পরীক্ষামূলক পর্যায় সম্মতি দেওয়া প্রাপ্তবয়স্কদের জন্য। এখানে জরুরি বা ক্লিনিক্যাল সহায়তার দাবি নেই"},{"id":"adapters","title":"সক্রিয় এজেন্ট যুক্ত করা","body":"প্রস্তাবিত অ্যাডাপ্টার কেবল নির্বাচিত অবদান, ভূমিকা, উৎস, সংস্করণ ও অনুমতির পরিসর পাঠায়। আমদানি লেখক, অধিকার বা সম্মতি নিশ্চিত করে না। নেটওয়ার্ক পরিবহন, গোপনীয় তথ্য, অনুমতি, পরিচালনাকারী ও লগের জন্য আলাদা বাস্তবায়ন ও যাচাই দরকার; এখন সেগুলি বন্ধ"},{"id":"languages","title":"ভাষা ও অর্থের স্থানান্তর","body":"প্রতিটি সংস্করণ রুশ উৎস ও তার SHA-এর সঙ্গে যুক্ত থাকে। নাম, ID, enums ও কোড সংরক্ষিত থাকে। নাকরণ, অনিশ্চয়তা, নির্বাচন ও পরিণতি যাচাই করা হয়। язэхъ আলাদা পরীক্ষামূলক অবস্থায় থাকে; তার অজানা অর্থ অনুমান দিয়ে পূরণ করা হয় না"},{"id":"next-step","title":"ব্যবহারযোগ্য ফল","body":"কর্মপরিসর ও প্রশ্ন বেছে নিন; অবদান, প্রস্তাব বা অবস্থান যোগ করুন; উৎস যাচাই করুন; JSON সংরক্ষণ করুন; প্রয়োজনে নির্বাচিত নথি অন্য স্থানীয় কর্মশালায় আমদানি করুন। নিজের রপ্তানি নিজে থেকেই সাধারণ বা প্রকাশ্য হয়ে যায় না"}],"roles":[{"id":"initiator","label":"সূচনাকারী","scope":"প্রশ্ন, প্রসঙ্গ ও উপযোগিতার মানদণ্ড নির্ধারণ করেন"},{"id":"contributor","label":"অংশগ্রহণকারী","scope":"ভিত্তি, বিকল্প, উদাহরণ বা সীমা যোগ করেন"},{"id":"reviewer","label":"পর্যালোচনাকারী","scope":"উৎস, পরিণতি ও অর্থহানি তুলনা করেন"},{"id":"human_steward","label":"দায়িত্বশীল মানুষ","scope":"নিজের যাচাইকৃত ক্ষেত্রের মধ্যে আলাদা সিদ্ধান্ত নেন; স্থানীয় ভূমিকার নাম ক্ষমতা তৈরি করে না"}],"workflow":[{"id":"question","title":"প্রশ্ন","body":"কী বোঝা, প্রকাশ করা বা যাচাই করা গুরুত্বপূর্ণ?"},{"id":"context","title":"প্রসঙ্গ","body":"যৌথ বিবেচনার জন্য কী বেছে নেওয়া হয়েছে এবং কোন ভিত্তিতে?"},{"id":"proposal","title":"প্রস্তাব","body":"সামর্থ্যের মধ্যে কোন পদক্ষেপের প্রস্তাব আছে এবং ফল কীভাবে দেখা যাবে?"},{"id":"positions","title":"অবস্থান আলাদা করা","body":"কী সমর্থিত, কী ন
